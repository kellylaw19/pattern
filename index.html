      let halfLen_calf = Math.round((calf_circ / pressure_divisor) * 10) / 10;
      let halfLen_narrow = Math.round((narrowest_circ / pressure_divisor) * 10) / 10;

      // Back malleolus arc divisor: 2.3 when pressure_divisor=4.6, else pressure_divisor/2
      let halfLen_backmal = Math.round((back_mal_arc / malleolus_divisor) * 10) / 10;

      if (!drawRulerInPDF) {
        ctx.save();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(50, 40);
        ctx.lineTo(50 + 10*scale, 40);
        ctx.stroke();
        for (let i=0; i<=10; ++i) {
          ctx.beginPath();
          ctx.moveTo(50 + i*scale, 40);
          ctx.lineTo(50 + i*scale, 22);
          ctx.stroke();
          ctx.font = "bold 13px Arial";
          ctx.fillStyle = "#000";
          ctx.fillText(i, 50 + i*scale - 3, 62);
        }
        for (let i=0; i<=20; ++i) {
          if (i%2===0) continue;
          ctx.beginPath();
          ctx.moveTo(50 + i*scale/2, 40);
          ctx.lineTo(50 + i*scale/2, 30);
          ctx.stroke();
        }
        ctx.font = "14px Arial";
        ctx.fillStyle = "#000";
        ctx.fillText("Calibration ruler: This should be exactly 10 cm", 50 + 5*scale - 85, 14);
        ctx.restore();
      }

      let startX = canvas.width / 2;
      let startY = 100;

      // Vertical level positions
      let y_first_round = startY + first_leg_round_level * scale;
      let y_mid_thigh = startY + mid_thigh_level * scale;
      let y_above_knee = startY + narrowest_above_knee_level * scale;
      let y_knee = startY + knee_level * scale;
      let y0 = startY + narrowest_below_knee_level * scale;
      let y_calf = startY + calf_level * scale;
      let y_narrow = startY + narrowest_level * scale;
      let y_backmal = startY + back_mal_level * scale;
      let y_first_to_mal_end = y_first_round + leglen_first * scale;

      // Upper points
      let A2 = { x: startX - halfLen_first * scale, y: y_first_round };
      let B2 = { x: startX + halfLen_first * scale, y: y_first_round };

      let Apr = { x: startX - halfLen_mid_thigh * scale, y: y_mid_thigh };
      let Bpr = { x: startX + halfLen_mid_thigh * scale, y: y_mid_thigh };

      let Cpr = { x: startX - halfLen_above_knee * scale, y: y_above_knee };
      let Dpr = { x: startX + halfLen_above_knee * scale, y: y_above_knee };

      let Epr = { x: startX - halfLen_knee * scale, y: y_knee };
      let Fpr = { x: startX + halfLen_knee * scale, y: y_knee };

      // Lower points
      let A = { x: startX - halfLen_bk * scale, y: y0 };
      let B = { x: startX + halfLen_bk * scale, y: y0 };
      let C = { x: startX - halfLen_calf * scale, y: y_calf };
      let D = { x: startX + halfLen_calf * scale, y: y_calf };
      let E = { x: startX - halfLen_narrow * scale, y: y_narrow };
      let F = { x: startX + halfLen_narrow * scale, y: y_narrow };
      let G = { x: startX - halfLen_backmal * scale, y: y_backmal };
      let H = { x: startX + halfLen_backmal * scale, y: y_backmal };

      // Dotted vertical center line: 0 cm at 1st leg round level
      ctx.save();
      ctx.strokeStyle = "#444";
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, y_first_round);
      ctx.lineTo(startX, y_first_to_mal_end);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(startX - 10, y_first_round);
      ctx.lineTo(startX + 10, y_first_round);
      ctx.moveTo(startX - 10, y_first_to_mal_end);
      ctx.lineTo(startX + 10, y_first_to_mal_end);
      ctx.stroke();

      ctx.font = "13px Arial";
      ctx.fillStyle = "#003366";
      ctx.fillText("0 cm (1st leg round)", startX + 14, y_first_round + 4);
      ctx.fillText(leglen_first.toFixed(1) + " cm", startX + 14, y_first_to_mal_end + 4);
      ctx.restore();

      function drawLevelLine(p1, p2, labelL, labelR, yText, cmVal, cmColor, showLen = true) {
        ctx.strokeStyle = cmColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.font = "bold 15px Arial";
        ctx.fillStyle = "#222";
        ctx.fillText(labelL, p1.x - 22, p1.y + 6);
        ctx.fillText(labelR, p2.x + 8, p2.y + 6);
        if (showLen) {
          ctx.font = "12px Arial";
          ctx.fillStyle = cmColor;
          ctx.fillText(cmVal, startX - 24, yText - 16);
        }
      }

      // New top line A''–B''
      drawLevelLine(A2, B2, "A''", "B''", y_first_round, (halfLen_first * 2).toFixed(1) + " cm", "#d64545");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(first_leg_round_level + " cm", B2.x + 20, y_first_round - 8);

      drawLevelLine(Apr, Bpr, "A'", "B'", y_mid_thigh, (halfLen_mid_thigh * 2).toFixed(1) + " cm", "#0b7fab");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(mid_thigh_level + " cm", Bpr.x + 20, y_mid_thigh - 8);

      drawLevelLine(Cpr, Dpr, "C'", "D'", y_above_knee, (halfLen_above_knee * 2).toFixed(1) + " cm", "#7b3fc8");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(narrowest_above_knee_level + " cm", Dpr.x + 20, y_above_knee - 8);

      drawLevelLine(Epr, Fpr, "E'", "F'", y_knee, (halfLen_knee * 2).toFixed(1) + " cm", "#a14a22");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(knee_level + " cm", Fpr.x + 20, y_knee - 8);

      drawLevelLine(A, B, "A", "B", y0, (halfLen_bk * 2).toFixed(1) + " cm", "#2277cc");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(narrowest_below_knee_level + " cm", B.x + 20, y0 - 8);

      drawLevelLine(C, D, "C", "D", y_calf, (halfLen_calf * 2).toFixed(1) + " cm", "#7c3bff");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(calf_level + " cm", D.x + 20, y_calf - 8);

      drawLevelLine(E, F, "E", "F", y_narrow, (halfLen_narrow * 2).toFixed(1) + " cm", "#19b37b");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(narrowest_level + " cm", F.x + 20, y_narrow - 8);

      drawLevelLine(G, H, "G", "H", y_backmal, (halfLen_backmal * 2).toFixed(1) + " cm", "#ff7c7c");
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText(back_mal_level + " cm", H.x + 20, y_backmal - 8);

      // Side contour connections (including A''->A' and B''->B')
      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(A2.x, A2.y);
      ctx.lineTo(Apr.x, Apr.y);
      ctx.lineTo(Cpr.x, Cpr.y);
      ctx.lineTo(Epr.x, Epr.y);
      ctx.lineTo(A.x, A.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(B2.x, B2.y);
      ctx.lineTo(Bpr.x, Bpr.y);
      ctx.lineTo(Dpr.x, Dpr.y);
      ctx.lineTo(Fpr.x, Fpr.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();

      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(C.x, C.y); ctx.lineTo(E.x, E.y); ctx.lineTo(G.x, G.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(D.x, D.y); ctx.lineTo(F.x, F.y); ctx.lineTo(H.x, H.y); ctx.stroke();

      // --- Foot construction ---
      let GH = Math.abs(H.x - G.x) / scale;
      let heelHalf = heel_len / 2;
      let GHhalf = GH / 2;
      let segLen = Math.round((heelHalf - GHhalf) * 10) / 10;
      if(segLen < 0) segLen = 0;
      let I = {x: G.x - segLen*scale, y: G.y};
      let J = {x: H.x + segLen*scale, y: H.y};
      ctx.strokeStyle = "#f90"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(G.x, G.y); ctx.lineTo(I.x, I.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(H.x, H.y); ctx.lineTo(J.x, J.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("I", I.x - 18, I.y + 6); ctx.fillText("J", J.x + 8, J.y + 6);
      ctx.font = "12px Arial"; ctx.fillStyle = "#f90";
      ctx.fillText("IG = HJ = "+segLen.toFixed(1)+" cm", startX-80, G.y-32);

      let IG = Math.abs(I.x - G.x) / scale;

      // Front malleolus divisor: 2.3 when pressure_divisor=4.6, else pressure_divisor/2
      let y = Math.round(((front_mal_arc / malleolus_divisor) - IG)*10)/10;
      if(y < 0) y = 0;
      ctx.font = "13px Arial"; ctx.fillStyle = "#CC33CC";
      ctx.fillText("y = "+y.toFixed(1)+" cm", J.x + 60, J.y + 6);

      let ankle_result = Math.round(((ankle_front_arc / 2.3) - y)*10)/10;
      if(ankle_result < 0) ankle_result = 0;
      let K = {x: I.x, y: I.y + ankle_result*scale};
      let L = {x: startX, y: I.y + ankle_result*scale};
      let M = {x: J.x, y: J.y + ankle_result*scale};
      ctx.strokeStyle = "#CC33CC"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(I.x, I.y); ctx.lineTo(K.x, K.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(startX, I.y); ctx.lineTo(L.x, L.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(J.x, J.y); ctx.lineTo(M.x, M.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(K.x, K.y); ctx.lineTo(L.x, L.y); ctx.lineTo(M.x, M.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("K", K.x - 18, K.y + 6); ctx.fillText("L", L.x - 12, L.y + 18); ctx.fillText("M", M.x + 8, M.y + 6);
      ctx.font = "12px Arial"; ctx.fillStyle = "#CC33CC";
      ctx.fillText("KL = LM = "+ankle_result.toFixed(1)+" cm", L.x + 30, L.y - 8);

      let EF = Math.abs(F.x - E.x) / scale;
      let halfEF = EF / 2;
      let N = {x: L.x - halfEF*scale, y: L.y};
      let O = {x: L.x + halfEF*scale, y: L.y};
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("N", N.x - 16, N.y + 6); ctx.fillText("O", O.x + 8, O.y + 6);

      let hLP = (back_mal_level - narrowest_level - 1);
      let P = {x: L.x, y: L.y + hLP*scale};
      ctx.strokeStyle = "#0099ff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(L.x, L.y);
      ctx.lineTo(P.x, P.y);
      ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("P", P.x - 12, P.y + 18);

      let Q = {x: P.x - y*scale, y: P.y};
      let R = {x: P.x + y*scale, y: P.y};
      ctx.strokeStyle = "#b36b00"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Q.x, Q.y); ctx.lineTo(R.x, R.y);
      ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("Q", Q.x - 16, Q.y + 6); ctx.fillText("R", R.x + 8, R.y + 6);

      let EG = Math.hypot(G.x - E.x, G.y - E.y) / scale;
      let intersNQ = getCircleIntersections(N, EG*scale, Q, IG*scale);
      let S = null;
      if(intersNQ.length === 2) {
        S = intersNQ[0].x < intersNQ[1].x ? intersNQ[0] : intersNQ[1];
        ctx.beginPath(); ctx.arc(S.x, S.y, 4, 0, 2*Math.PI);
        ctx.fillStyle = "#e60000"; ctx.fill();
        ctx.font = "bold 15px Arial"; ctx.fillText("S", S.x - 18, S.y + 6);
        ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(N.x, N.y); ctx.lineTo(S.x, S.y); ctx.stroke();
      }

      let intersOR = getCircleIntersections(O, EG*scale, R, IG*scale);
      let T = null;
      if(intersOR.length === 2) {
        T = intersOR[0].x > intersOR[1].x ? intersOR[0] : intersOR[1];
        ctx.beginPath(); ctx.arc(T.x, T.y, 4, 0, 2*Math.PI);
        ctx.fillStyle = "#e60000"; ctx.fill();
        ctx.font = "bold 15px Arial"; ctx.fillText("T", T.x + 10, T.y + 6);
        ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(O.x, O.y); ctx.lineTo(T.x, T.y); ctx.stroke();
      }

      let IK_height = Math.abs(K.y - I.y);
      function pointAlongLine(p0, p1, d) {
        let dx = p1.x - p0.x, dy = p1.y - p0.y;
        let len = Math.hypot(dx, dy);
        return { x: p0.x + (dx/len)*d, y: p0.y + (dy/len)*d };
      }
      let U = null, V = null;
      if (S) {
        U = pointAlongLine(Q, S, IK_height);
        ctx.strokeStyle = "#7c4dff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(Q.x, Q.y); ctx.lineTo(U.x, U.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#7c4dff"; ctx.fillText("U", U.x - 16, U.y + 6);
        ctx.font = "12px Arial"; ctx.fillText("IK height = "+(IK_height/scale).toFixed(1)+" cm", (Q.x + U.x)/2 - 30, (Q.y + U.y)/2 - 10);
      }
      if (T) {
        V = pointAlongLine(R, T, IK_height);
        ctx.strokeStyle = "#7c4dff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(R.x, R.y); ctx.lineTo(V.x, V.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#7c4dff"; ctx.fillText("V", V.x + 8, V.y + 6);
      }

      let W = {x: P.x, y: P.y + ankle2meta*scale};
      ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(W.x, W.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#e67e22"; ctx.fillText("W", W.x - 10, W.y + 20);
      ctx.font = "12px Arial"; ctx.fillText(ankle2meta.toFixed(1)+" cm", (P.x+W.x)/2 + 10, (P.y+W.y)/2 + 2);

      let meta_arc_len = Math.round((meta_head_arc / 1.15)*10)/10;
      let arc_half = meta_arc_len/2 * scale;
      let angle_deg = -10;
      let angle_rad = angle_deg * Math.PI / 180;
      let Y0 = {x: W.x - arc_half, y: W.y};
      let Z0 = {x: W.x + arc_half, y: W.y};
      let Y = rotatePoint(W.x, W.y, Y0.x, Y0.y, angle_rad);
      let Z = rotatePoint(W.x, W.y, Z0.x, Z0.y, angle_rad);

      let a = { x: Y.x + 3*scale, y: Y.y };
      let X = { x: a.x, y: a.y + meta2toe*scale };

      function mirror(pt) {
        if (footSide === "right") return {x: 2*startX - pt.x, y: pt.y};
        return pt;
      }
      let Ym = mirror(Y), Zm = mirror(Z), Xm = mirror(X);

      ctx.save();
      ctx.strokeStyle = "#2d85f0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Ym.x, Ym.y); ctx.lineTo(Zm.x, Zm.y); ctx.stroke();
      let yzLenCm = Math.hypot(Zm.x - Ym.x, Zm.y - Ym.y)/scale;
      let yzMid = { x: (Ym.x + Zm.x)/2, y: (Ym.y + Zm.y)/2 };
      ctx.font = "bold 14px Arial"; ctx.fillStyle = "#2d85f0";
      ctx.fillText("YZ = " + yzLenCm.toFixed(2) + " cm", yzMid.x - 40, yzMid.y - 12);
      ctx.restore();

      let bestH = 0, bestS = 0, bestH2 = 0, bestS2 = 0, minErr = 1e9, bestLen = 0;
      let bestP1 = null, bestP2 = null;
      let targetLen = (meta_toe_circum + 2) * scale;
      for (let h = 0; h <= 8*scale; h += 2.0) {
        for (let s = 0.5*scale; s <= 3*scale; s += 2.0) {
          for (let h2 = h; h2 <= h+7; h2 += 3.0) {
            for (let s2 = 1.2*scale; s2 <= 4*scale; s2 += 2.0) {
              let localP1 = footSide === "left" ? { x: Xm.x - s, y: Xm.y + h } : { x: Xm.x + s, y: Xm.y + h };
              let localP2 = footSide === "left" ? { x: Xm.x + s2, y: Xm.y + h2 } : { x: Xm.x - s2, y: Xm.y + h2 };
              let len = cubicBezierLength(Ym, localP1, localP2, Zm, 80);
              let err = Math.abs(len - targetLen);
              let roundnessBonus = s2/scale * (err < scale ? 2 : 0);
              let score = -err + roundnessBonus;
              if (score > -minErr + (bestS2/scale*2)) {
                minErr = err; bestH = h; bestS = s; bestH2 = h2; bestS2 = s2; bestLen = len; bestP1 = localP1; bestP2 = localP2;
              }
            }
          }
        }
      }
      if (!bestP1 || !bestP2) {
        bestP1 = Xm; bestP2 = Xm; bestLen = Math.hypot(Zm.x-Ym.x, Zm.y-Ym.y);
      }

      let p1 = bestP1, p2 = bestP2;

      function cubicClosestT(p0, p1, p2, p3, target, steps=100) {
        let minDist = 1e9, bestT = 0;
        for (let i=0; i<=steps; ++i) {
          let t = i/steps;
          let pt = cubicPointAtT(p0, p1, p2, p3, t);
          let d = Math.hypot(pt.x - target.x, pt.y - target.y);
          if (d < minDist) { minDist = d; bestT = t; }
        }
        return bestT;
      }

      let tSplit = cubicClosestT(Ym, p1, p2, Zm, Xm, 150);

      function splitCubicAtT(p0, p1, p2, p3, t) {
        let q0 = { x: p0.x + (p1.x - p0.x)*t, y: p0.y + (p1.y - p0.y)*t };
        let q1 = { x: p1.x + (p2.x - p1.x)*t, y: p1.y + (p2.y - p1.y)*t };
        let q2 = { x: p2.x + (p3.x - p2.x)*t, y: p2.y + (p3.y - p2.y)*t };
        let r0 = { x: q0.x + (q1.x - q0.x)*t, y: q0.y + (q1.y - q0.y)*t };
        let r1 = { x: q1.x + (q2.x - q1.x)*t, y: q1.y + (q2.y - q1.y)*t };
        let s0 = { x: r0.x + (r1.x - r0.x)*t, y: r0.y + (r1.y - r0.y)*t };
        return [[p0, q0, r0, s0], [s0, r1, q2, p3]];
      }

      let [arc1, arc2] = splitCubicAtT(Ym, p1, p2, Zm, tSplit);

      let arc1Length = cubicBezierLength(arc1[0], arc1[1], arc1[2], arc1[3], 120);
      let arc2Length = cubicBezierLength(arc2[0], arc2[1], arc2[2], arc2[3], 120);
      let tMid1 = findCubicTforArcLength(arc1[0], arc1[1], arc1[2], arc1[3], arc1Length/2, arc1Length, 180);
      let tMid2 = findCubicTforArcLength(arc2[0], arc2[1], arc2[2], arc2[3], arc2Length/2, arc2Length, 180);
      let b = cubicPointAtT(arc1[0], arc1[1], arc1[2], arc1[3], tMid1);
      let c = cubicPointAtT(arc2[0], arc2[1], arc2[2], arc2[3], tMid2);

      if (!arc1Control) arc1Control = { x: b.x, y: b.y };
      if (!arc2Control) arc2Control = { x: c.x, y: c.y };

      function computeCubicHandlesForMidpoint(p0, p3, mid, t=0.5) {
        let d = 0.45;
        let p1 = { x: p0.x + (mid.x - p0.x) * d, y: p0.y + (mid.y - p0.y) * d };
        let p2 = { x: p3.x + (mid.x - p3.x) * d, y: p3.y + (mid.y - p3.y) * d };
        return [p1, p2];
      }

      let arc1p1 = arc1[1], arc1p2 = arc1[2], arc2p1 = arc2[1], arc2p2 = arc2[2];
      if (arc1Handles) [arc1p1, arc1p2] = arc1Handles;
      if (arc2Handles) [arc2p1, arc2p2] = arc2Handles;
      if ((arc1Control && dragState.dragging === "b") || arc1Handles) {
        [arc1p1, arc1p2] = computeCubicHandlesForMidpoint(arc1[0], arc1[3], arc1Control, 0.5);
        arc1Handles = [arc1p1, arc1p2];
      }
      if ((arc2Control && dragState.dragging === "c") || arc2Handles) {
        [arc2p1, arc2p2] = computeCubicHandlesForMidpoint(arc2[0], arc2[3], arc2Control, 0.5);
        arc2Handles = [arc2p1, arc2p2];
      }

      ctx.save();
      ctx.strokeStyle = "#ff5522"; ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(arc1[0].x, arc1[0].y);
      ctx.bezierCurveTo(arc1p1.x, arc1p1.y, arc1p2.x, arc1p2.y, arc1[3].x, arc1[3].y);
      ctx.moveTo(arc2[0].x, arc2[0].y);
      ctx.bezierCurveTo(arc2p1.x, arc2p1.y, arc2p2.x, arc2p2.y, arc2[3].x, arc2[3].y);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(arc1Control.x, arc1Control.y, 7, 0, 2*Math.PI);
      ctx.fillStyle = "#16a085"; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1.0;
      ctx.beginPath(); ctx.arc(arc2Control.x, arc2Control.y, 7, 0, 2*Math.PI);
      ctx.fillStyle = "#16a085"; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1.0;
      ctx.restore();

      ctx.font = "bold 13px Arial";
      ctx.fillStyle = "#ff5522";
      ctx.fillText("Y–X–Z arc ≈ " + (bestLen/scale).toFixed(2) + " cm", Xm.x + 15, Xm.y + 40);

      ctx.save();
      ctx.beginPath(); ctx.arc(Ym.x, Ym.y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "#2d85f0"; ctx.fill();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#0033cc";
      ctx.fillText("Y", Ym.x - 18, Ym.y - 5);
      ctx.beginPath(); ctx.arc(Xm.x, Xm.y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "#16a085"; ctx.fill();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#16a085";
      ctx.fillText("X", Xm.x - 10, Xm.y - 10);
      ctx.beginPath(); ctx.arc(Zm.x, Zm.y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "#2d85f0"; ctx.fill();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#0033cc";
      ctx.fillText("Z", Zm.x + 10, Zm.y - 5);
      ctx.restore();

      let bow = 7;
      let Um = null, Vm = null;
      if (U) Um = mirror(U);
      if (V) Vm = mirror(V);
      if (Um && Ym) {
        let mid = { x: (Um.x+Ym.x)/2, y: (Um.y+Ym.y)/2 };
        let control = footSide === "left" ? { x: mid.x + bow, y: mid.y } : { x: mid.x - bow, y: mid.y };
        ctx.save();
        ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.7;
        ctx.beginPath(); ctx.moveTo(Um.x, Um.y); ctx.quadraticCurveTo(control.x, control.y, Ym.x, Ym.y); ctx.stroke();
        ctx.restore();
      }
      if (Vm && Zm) {
        let midVZ = { x: (Vm.x+Zm.x)/2, y: (Vm.y+Zm.y)/2 };
        let controlVZ = footSide === "left" ? { x: midVZ.x - bow, y: midVZ.y } : { x: midVZ.x + bow, y: midVZ.y };
        ctx.save();
        ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.7;
        ctx.beginPath(); ctx.moveTo(Vm.x, Vm.y); ctx.quadraticCurveTo(controlVZ.x, controlVZ.y, Zm.x, Zm.y); ctx.stroke();
        ctx.restore();
      }
    }

    function getMousePos(canvas, evt) {
      let rect = canvas.getBoundingClientRect();
      if (evt.touches && evt.touches.length > 0) {
        return {
          x: (evt.touches[0].clientX - rect.left) * (canvas.width / rect.width),
          y: (evt.touches[0].clientY - rect.top) * (canvas.height / rect.height)
        };
      }
      return {
        x: (evt.clientX - rect.left) * (canvas.width / rect.width),
        y: (evt.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function onCanvasDown(evt) {
      const canvas = document.getElementById('sockPattern');
      const pos = getMousePos(canvas, evt);
      let d1 = Math.hypot(pos.x - arc1Control.x, pos.y - arc1Control.y);
      let d2 = Math.hypot(pos.x - arc2Control.x, pos.y - arc2Control.y);
      if (d1 < 14) {
        dragState.dragging = "b";
        dragState.offsetX = arc1Control.x - pos.x;
        dragState.offsetY = arc1Control.y - pos.y;
        evt.preventDefault();
      } else if (d2 < 14) {
        dragState.dragging = "c";
        dragState.offsetX = arc2Control.x - pos.x;
        dragState.offsetY = arc2Control.y - pos.y;
        evt.preventDefault();
      }
    }

    function onCanvasMove(evt) {
      if (!dragState.dragging) return;
      const canvas = document.getElementById('sockPattern');
      const pos = getMousePos(canvas, evt);
      if (dragState.dragging === "b") {
        arc1Control.x = pos.x + dragState.offsetX;
        arc1Control.y = pos.y + dragState.offsetY;
        arc1Handles = null;
      } else if (dragState.dragging === "c") {
        arc2Control.x = pos.x + dragState.offsetX;
        arc2Control.y = pos.y + dragState.offsetY;
        arc2Handles = null;
      }
      drawPattern();
      evt.preventDefault();
    }

    function onCanvasUp() { dragState.dragging = null; }
    function onCanvasLeave() { dragState.dragging = null; }
    function onCanvasTouchStart(evt) { onCanvasDown(evt); }
    function onCanvasTouchMove(evt) { onCanvasMove(evt); }
    function onCanvasTouchEnd(evt) { onCanvasUp(evt); }

    let debounceTimer = null;
    function debounceDrawPattern() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        resetBezierDrags();
        drawPattern();
      }, 300);
    }

    window.onload = function() {
      drawPattern();
      const canvas = document.getElementById('sockPattern');
      canvas.addEventListener('mousedown', onCanvasDown);
      canvas.addEventListener('mousemove', onCanvasMove);
      canvas.addEventListener('mouseup', onCanvasUp);
      canvas.addEventListener('mouseleave', onCanvasLeave);
      canvas.addEventListener('touchstart', onCanvasTouchStart, { passive: false });
      canvas.addEventListener('touchmove', onCanvasTouchMove, { passive: false });
      canvas.addEventListener('touchend', onCanvasTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', onCanvasTouchEnd, { passive: false });

      // Instant update for divisor input
      document.getElementById('pressure_divisor').addEventListener('input', () => {
        resetBezierDrags();
        drawPattern();
      });
    };

    document.getElementById('sockForm').addEventListener('input', debounceDrawPattern);

    function printPatternOnly() {
      const origCanvas = document.getElementById("sockPattern");
      const width = origCanvas.width, height = origCanvas.height;
      const printCanvas = document.createElement("canvas");
      printCanvas.width = width;
      printCanvas.height = height;
      drawPattern(printCanvas.getContext("2d"), true);
      const cropped = cropCanvasToPattern(printCanvas);
      const mainCanvas = document.getElementById("sockPattern");
      const origW = mainCanvas.width, origH = mainCanvas.height;
      mainCanvas.width = cropped.width;
      mainCanvas.height = cropped.height;
      const ctx = mainCanvas.getContext("2d");
      ctx.drawImage(cropped, 0, 0);
      window.print();
      setTimeout(() => {
        mainCanvas.width = origW;
        mainCanvas.height = origH;
        drawPattern();
      }, 100);
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const previewCanvas = document.getElementById("sockPattern");
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = previewCanvas.width;
      exportCanvas.height = previewCanvas.height;
      drawPattern(exportCanvas.getContext("2d"), true);

      const cropped = cropCanvasToPattern(exportCanvas);
      const pxPerCm = 10;
      const widthCm = cropped.width / pxPerCm;
      const heightCm = cropped.height / pxPerCm;
      const widthMM = widthCm * 10;
      const heightMM = heightCm * 10;

      const pageWidth = 297, pageHeight = 420;
      const marginTop = 12, marginBottom = 12;
      const maxImgHeightPerPage = pageHeight - marginTop - marginBottom;
      const pages = Math.ceil(heightMM / maxImgHeightPerPage);

      function getPatternPageImage(pageIdx, sliceHeightPx) {
        let pageCanvas = document.createElement('canvas');
        pageCanvas.width = cropped.width;
        pageCanvas.height = sliceHeightPx;
        let pageCtx = pageCanvas.getContext('2d');
        let syPx = Math.round((pageIdx * maxImgHeightPerPage) * pxPerCm / 10);
        pageCtx.save();
        pageCtx.translate(0, -syPx);
        pageCtx.drawImage(cropped, 0, 0);
        pageCtx.restore();
        let bbox = getPatternBoundingBox(pageCanvas);
        if (!bbox) return null;
        return pageCanvas.toDataURL("image/png", 1.0);
      }

      const pdf = new jsPDF({
        orientation: widthMM > heightMM ? "landscape" : "portrait",
        unit: "mm",
        format: "a3"
      });

      let addedPages = 0;
      for (let p=0; p<pages; ++p) {
        let sliceHeightMM = Math.min(heightMM - p * maxImgHeightPerPage, maxImgHeightPerPage);
        let sliceHeightPx = Math.round(sliceHeightMM * pxPerCm / 10);
        let pageDataUrl = getPatternPageImage(p, sliceHeightPx);
        if (!pageDataUrl) continue;
        if (addedPages > 0) pdf.addPage();
        let x = (pageWidth - widthMM) / 2;
        let y = marginTop;
        pdf.addImage(pageDataUrl, "PNG", x, y, widthMM, sliceHeightMM);
        pdf.setFontSize(10);
        pdf.text(`Page ${addedPages+1}`, pageWidth - 40, pageHeight - 8);
        addedPages++;
      }

      pdf.save("sock-pattern-true-size-a3.pdf");
    }
  </script>
</body>
</html>

    }

    function getCircleIntersections(c1, r1, c2, r2) {
      let dx = c2.x - c1.x, dy = c2.y - c1.y;
      let d = Math.hypot(dx, dy);
      if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return [];
      let a = (r1*r1 - r2*r2 + d*d) / (2*d);
      let h = Math.sqrt(Math.max(0, r1*r1 - a*a));
      let xm = c1.x + a*dx/d, ym = c1.y + a*dy/d;
      let rx = -dy * (h/d), ry = dx * (h/d);

    function circleFrom3Points(p1, p2, p3) {
      const x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y, x3 = p3.x, y3 = p3.y;
      const d = 2 * (x1*(y2 - y3) + x2*(y3 - y1) + x3*(y1 - y2));
      if (Math.abs(d) < 1e-9) return null;
      const ux = ((x1*x1 + y1*y1)*(y2 - y3) + (x2*x2 + y2*y2)*(y3 - y1) + (x3*x3 + y3*y3)*(y1 - y2)) / d;
      const uy = ((x1*x1 + y1*y1)*(x3 - x2) + (x2*x2 + y2*y2)*(x1 - x3) + (x3*x3 + y3*y3)*(x2 - x1)) / d;
      return { c: {x: ux, y: uy}, r: Math.hypot(x1 - ux, y1 - uy) };

    function isAngleOnCCW(aStart, aEnd, aTest) {
      aStart = normAngle(aStart); aEnd = normAngle(aEnd); aTest = normAngle(aTest);
      if (aEnd < aStart) aEnd += Math.PI * 2;
      if (aTest < aStart) aTest += Math.PI * 2;
      return aTest >= aStart && aTest <= aEnd;

    function rotatePoint(cx, cy, px, py, angleRad) {
      let dx = px - cx, dy = py - cy, cos = Math.cos(angleRad), sin = Math.sin(angleRad);
      return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };

    function cubicBezierLength(p0, p1, p2, p3, steps=80) {
      let len = 0, prev = p0;
      for (let i=1; i<=steps; ++i) {
        let t = i/steps;
        let x = Math.pow(1-t,3)*p0.x + 3*Math.pow(1-t,2)*t*p1.x + 3*(1-t)*t*t*p2.x + t*t*t*p3.x;
        let y = Math.pow(1-t,3)*p0.y + 3*Math.pow(1-t,2)*t*p1.y + 3*(1-t)*t*t*p2.y + t*t*t*p3.y;
        let pt = {x, y};
        len += Math.hypot(pt.x - prev.x, pt.y - prev.y);
        prev = pt;
      }
      return len;
    }

    function cubicPointAtT(p0, p1, p2, p3, t) {
      let mt = 1-t, mt2 = mt*mt, t2 = t*t;
      return {
        x: mt2*mt*p0.x + 3*mt2*t*p1.x + 3*mt*t2*p2.x + t2*t*p3.x,
        y: mt2*mt*p0.y + 3*mt2*t*p1.y + 3*mt*t2*p2.y + t2*t*p3.y
      };
    }

    function findCubicTforArcLength(p0, p1, p2, p3, targetLen, totalLen, steps=200) {
      let len = 0, prev = p0;
      for (let i=1; i<=steps; ++i) {
        let t = i/steps;
        let pt = cubicPointAtT(p0, p1, p2, p3, t);
        len += Math.hypot(pt.x - prev.x, pt.y - prev.y);
        if (len >= targetLen) return t;
        prev = pt;
      }
      return 1;
    }

    function getPatternBoundingBox(canvas, bgColor=[255, 251, 231, 255]) {
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      const imageData = ctx.getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = 0, maxY = 0, found = false;
      for (let y=0; y<height; ++y) {
        for (let x=0; x<width; ++x) {
          let idx = (y*width + x)*4;
          let r = imageData[idx], g = imageData[idx+1], b = imageData[idx+2], a = imageData[idx+3];
          let isBg = (Math.abs(r-bgColor[0])<=3 && Math.abs(g-bgColor[1])<=3 && Math.abs(b-bgColor[2])<=3 && a === 255);
          if (!isBg) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) return null;
      minX = Math.max(0, minX-20); minY = Math.max(0, minY-20);
      maxX = Math.min(width-1, maxX+20); maxY = Math.min(height-1, maxY+20);
      return {minX, minY, maxX, maxY};
    }

    function cropCanvasToPattern(srcCanvas) {
      let bbox = getPatternBoundingBox(srcCanvas);
      if (!bbox) return srcCanvas;
      let {minX, minY, maxX, maxY} = bbox;
      let w = maxX - minX + 1, h = maxY - minY + 1;
      let cropped = document.createElement('canvas');
      cropped.width = w; cropped.height = h;
      let ctx = cropped.getContext('2d');
      ctx.fillStyle = "#fffbe7";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(srcCanvas, minX, minY, w, h, 0, 0, w, h);
      return cropped;
    }

    let dragState = { dragging: null, offsetX: 0, offsetY: 0 };
    let arc1Control = null, arc2Control = null, arc1Handles = null, arc2Handles = null;
    let waistRightCtrl = null, waistLeftCtrl = null;
    let o2ArcCtrl1 = null; let o2ArcCtrl2 = null; let o2ArcCustom = false;

    let handleDrawPos = {
      waistRight: null, waistLeft: null, o2Arc1: null, o2Arc2: null, yzArc1: null, yzArc2: null
    };

    function resetBezierDrags() {
      arc1Control = null; arc2Control = null; arc1Handles = null; arc2Handles = null;
      waistRightCtrl = null; waistLeftCtrl = null;
      o2ArcCtrl1 = null; o2ArcCtrl2 = null; o2ArcCustom = false;
      handleDrawPos = { waistRight:null, waistLeft:null, o2Arc1:null, o2Arc2:null, yzArc1:null, yzArc2:null };
    }

    function resetToOriginalPattern() {
      applyOriginalDefaults();
      resetBezierDrags();
      drawPattern();
    }

    function drawGreenHandle(ctx, x, y, label) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 2*Math.PI);
      ctx.fillStyle = "#16a085"; ctx.globalAlpha = 0.92; ctx.fill(); ctx.globalAlpha = 1;
      if (label) {
        ctx.font = "bold 14px Arial";
        ctx.fillStyle = "#16a085";
        ctx.fillText(label, x + 9, y - 9);
      }
      ctx.restore();
    }

    function drawPattern(ctxOverride, drawRulerInPDF=false) {
      let canvas, ctx;
      if (ctxOverride) { ctx = ctxOverride; canvas = ctx.canvas; }
      else {
        canvas = document.getElementById('sockPattern');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      const scale = 10;
      let startX = footSide === "right" ? 300 : canvas.width / 2;
      let startY = 100;
      const mx = (x) => (footSide === "right" ? (2 * startX - x) : x);
      const M = (p) => ({ x: mx(p.x), y: p.y });

      let leglen_waist = parseFloat(document.getElementById('leglen_waist').value);
      let waist_level = parseFloat(document.getElementById('waist_level').value);
      let waist_circ = parseFloat(document.getElementById('waist_circ').value);
      let hip_level = parseFloat(document.getElementById('hip_level').value);
      let hip_circ = parseFloat(document.getElementById('hip_circ').value);

      let first_leg_round_level = parseFloat(document.getElementById('first_leg_round_level').value);
      let first_leg_round_circ = parseFloat(document.getElementById('first_leg_round_circ').value);
      let mid_thigh_level = parseFloat(document.getElementById('mid_thigh_level').value);
      let mid_thigh_circ = parseFloat(document.getElementById('mid_thigh_circ').value);
      let narrowest_above_knee_level = parseFloat(document.getElementById('narrowest_above_knee_level').value);
      let narrowest_above_knee_circ = parseFloat(document.getElementById('narrowest_above_knee_circ').value);
      let knee_level = parseFloat(document.getElementById('knee_level').value);
      let knee_circ = parseFloat(document.getElementById('knee_circ').value);
      let narrowest_below_knee_level = parseFloat(document.getElementById('narrowest_below_knee_level').value);
      let bk_circ = parseFloat(document.getElementById('bk_circ').value);
      let calf_level = parseFloat(document.getElementById('calf_level').value);
      let calf_circ = parseFloat(document.getElementById('calf_circ').value);
      let narrowest_level = parseFloat(document.getElementById('narrowest_level').value);
      let narrowest_circ = parseFloat(document.getElementById('narrowest_circ').value);
      let back_mal_level = parseFloat(document.getElementById('back_mal_level').value);
      let back_mal_arc = parseFloat(document.getElementById('back_mal_arc').value);

      let heel_len = parseFloat(document.getElementById('heel_len').value);
      let front_mal_arc = parseFloat(document.getElementById('front_mal_arc').value);
      let ankle_front_arc = parseFloat(document.getElementById('ankle_front_arc').value);
      let ankle2meta = parseFloat(document.getElementById('ankle2meta').value);
      let meta2toe = parseFloat(document.getElementById('meta2toe').value);
      let meta_head_arc = parseFloat(document.getElementById('meta_head_arc').value);
      let meta_toe_circum = parseFloat(document.getElementById('meta_toe_circum').value);

      let waistHipDiv = parseFloat(document.getElementById('waist_hip_divisor').value);
      if (!isFinite(waistHipDiv) || waistHipDiv <= 0) waistHipDiv = 4;

      let legsDiv = parseFloat(document.getElementById('legs_divisor').value);
      if (!isFinite(legsDiv) || legsDiv <= 0) legsDiv = 4.6;

      let malDiv = Math.abs(legsDiv - 4.6) < 1e-9 ? 2.3 : (legsDiv / 2);
      if (!isFinite(malDiv) || malDiv <= 0) malDiv = 2.3;

      let halfLen_first = Math.round((first_leg_round_circ / legsDiv) * 10) / 10;
      let halfLen_mid_thigh = Math.round((mid_thigh_circ / legsDiv) * 10) / 10;
      let halfLen_above_knee = Math.round((narrowest_above_knee_circ / legsDiv) * 10) / 10;
      let halfLen_knee = Math.round((knee_circ / legsDiv) * 10) / 10;
      let halfLen_bk = Math.round((bk_circ / legsDiv) * 10) / 10;
      let halfLen_calf = Math.round((calf_circ / legsDiv) * 10) / 10;
      let halfLen_narrow = Math.round((narrowest_circ / legsDiv) * 10) / 10;
      let halfLen_backmal = Math.round((back_mal_arc / malDiv) * 10) / 10;
      let halfLen_waist = Math.round((waist_circ / waistHipDiv) * 10) / 10;
      let halfLen_hip = Math.round((hip_circ / waistHipDiv) * 10) / 10;

      let y_waist = startY + waist_level * scale;
      let y_hip = startY + hip_level * scale;
      let y_first_round = startY + first_leg_round_level * scale;
      let y_mid_thigh = startY + mid_thigh_level * scale;
      let y_above_knee = startY + narrowest_above_knee_level * scale;
      let y_knee = startY + knee_level * scale;
      let y0 = startY + narrowest_below_knee_level * scale;
      let y_calf = startY + calf_level * scale;
      let y_narrow = startY + narrowest_level * scale;
      let y_backmal = startY + back_mal_level * scale;

      let A2 = { x: startX - halfLen_first * scale, y: y_first_round };
      let B2 = { x: startX + halfLen_first * scale, y: y_first_round };
      let Apr = { x: startX - halfLen_mid_thigh * scale, y: y_mid_thigh };
      let Bpr = { x: startX + halfLen_mid_thigh * scale, y: y_mid_thigh };
      let Cpr = { x: startX - halfLen_above_knee * scale, y: y_above_knee };
      let Dpr = { x: startX + halfLen_above_knee * scale, y: y_above_knee };
      let Epr = { x: startX - halfLen_knee * scale, y: y_knee };
      let Fpr = { x: startX + halfLen_knee * scale, y: y_knee };
      let A = { x: startX - halfLen_bk * scale, y: y0 };
      let B = { x: startX + halfLen_bk * scale, y: y0 };
      let C = { x: startX - halfLen_calf * scale, y: y_calf };
      let D = { x: startX + halfLen_calf * scale, y: y_calf };
      let E = { x: startX - halfLen_narrow * scale, y: y_narrow };
      let F = { x: startX + halfLen_narrow * scale, y: y_narrow };
      let G = { x: startX - halfLen_backmal * scale, y: y_backmal };
      let H = { x: startX + halfLen_backmal * scale, y: y_backmal };

      let aPrime = { x: A2.x + 2.5 * scale, y: y_first_round };
      let xL2 = aPrime.x;
      let O1 = { x: xL2, y: y_waist };
      let O2 = { x: xL2, y: y_hip };
      let W1 = { x: xL2 - halfLen_waist * scale, y: y_waist };
      let W2 = { x: xL2 + halfLen_waist * scale, y: y_waist };
      let H1 = { x: xL2 - halfLen_hip * scale, y: y_hip };
      let H2 = { x: xL2 + halfLen_hip * scale, y: y_hip };

      if (!drawRulerInPDF) {
        ctx.save();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(50, 40); ctx.lineTo(50 + 10*scale, 40); ctx.stroke();
        for (let i=0; i<=10; ++i) {
          ctx.beginPath(); ctx.moveTo(50 + i*scale, 40); ctx.lineTo(50 + i*scale, 22); ctx.stroke();
          ctx.font = "bold 13px Arial"; ctx.fillStyle = "#000"; ctx.fillText(i, 50 + i*scale - 3, 62);
        }
        for (let i=1; i<=19; i+=2) {
          ctx.beginPath(); ctx.moveTo(50 + i*scale/2, 40); ctx.lineTo(50 + i*scale/2, 30); ctx.stroke();
        }
        ctx.font = "14px Arial"; ctx.fillStyle = "#000";
        ctx.fillText("Calibration ruler: This should be exactly 10 cm", 50 + 5*scale - 85, 14);
        ctx.restore();
      }

      ctx.save();
      ctx.strokeStyle = "#444"; ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx(startX), y_first_round); ctx.lineTo(mx(startX), y_backmal); ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = "#444"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mx(startX - 10), y_first_round); ctx.lineTo(mx(startX + 10), y_first_round);
      ctx.moveTo(mx(startX - 10), y_backmal); ctx.lineTo(mx(startX + 10), y_backmal);
      ctx.stroke();

      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText("L1: 0 cm (1st leg round)", mx(startX) + (footSide==="left"?14:-170), y_first_round + 4);
      ctx.fillText((back_mal_level - first_leg_round_level).toFixed(1) + " cm", mx(startX) + (footSide==="left"?14:-70), y_backmal + 4);

      let y_L2_end = y_waist + leglen_waist * scale;
      ctx.save();
      ctx.strokeStyle = "#666"; ctx.setLineDash([4, 4]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx(xL2), y_waist); ctx.lineTo(mx(xL2), y_L2_end); ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = "#666"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mx(xL2 - 10), y_waist); ctx.lineTo(mx(xL2 + 10), y_waist);
      ctx.moveTo(mx(xL2 - 10), y_hip);   ctx.lineTo(mx(xL2 + 10), y_hip);
      ctx.stroke();

      ctx.font = "13px Arial"; ctx.fillStyle = "#333";
      ctx.fillText("L2: 0 cm (waist)", mx(xL2) + (footSide==="left"?14:-125), y_waist - 6);
      ctx.fillText("30 cm (hip)", mx(xL2) + (footSide==="left"?14:-95), y_hip - 6);

      function drawLevelLine(p1, p2, labelL, labelR, cmVal, color) {
        const m1 = M(p1), m2 = M(p2);
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.lineTo(m2.x, m2.y); ctx.stroke();

        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
        const left = m1.x < m2.x ? m1 : m2;
        const right = m1.x < m2.x ? m2 : m1;
        const leftLabel = m1.x < m2.x ? labelL : labelR;
        const rightLabel = m1.x < m2.x ? labelR : labelL;

        ctx.fillText(leftLabel, left.x - 24, left.y + 6);
        ctx.fillText(rightLabel, right.x + 8, right.y + 6);
        ctx.font = "12px Arial"; ctx.fillStyle = color;
        ctx.fillText(cmVal, (m1.x + m2.x)/2 - 18, m1.y - 16);
      }

      drawLevelLine(W1, W2, "W1′", "W2′", (halfLen_waist * 2).toFixed(1) + " cm", "#555");
      drawLevelLine(H1, H2, "H1′", "H2′", (halfLen_hip * 2).toFixed(1) + " cm", "#777");

      ctx.fillStyle = "#111"; ctx.font = "bold 15px Arial";
      const mO1 = M(O1), mO2 = M(O2);
      ctx.beginPath(); ctx.arc(mO1.x, mO1.y, 3, 0, 2*Math.PI); ctx.fill();
      ctx.beginPath(); ctx.arc(mO2.x, mO2.y, 3, 0, 2*Math.PI); ctx.fill();
      ctx.fillText("O1", mO1.x + 8, mO1.y - 8);
      ctx.fillText("O2", mO2.x + 8, mO2.y - 8);

      drawLevelLine(A2, B2, "A''", "B''", (halfLen_first * 2).toFixed(1) + " cm", "#d64545");
      drawLevelLine(Apr, Bpr, "A'", "B'", (halfLen_mid_thigh * 2).toFixed(1) + " cm", "#0b7fab");
      drawLevelLine(Cpr, Dpr, "C'", "D'", (halfLen_above_knee * 2).toFixed(1) + " cm", "#7b3fc8");
      drawLevelLine(Epr, Fpr, "E'", "F'", (halfLen_knee * 2).toFixed(1) + " cm", "#a14a22");
      drawLevelLine(A, B, "A", "B", (halfLen_bk * 2).toFixed(1) + " cm", "#2277cc");
      drawLevelLine(C, D, "C", "D", (halfLen_calf * 2).toFixed(1) + " cm", "#7c3bff");
      drawLevelLine(E, F, "E", "F", (halfLen_narrow * 2).toFixed(1) + " cm", "#19b37b");
      drawLevelLine(G, H, "G", "H", (halfLen_backmal * 2).toFixed(1) + " cm", "#ff7c7c");

      function putHeight(pt, txt) {
        const m = M(pt);
        ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
        ctx.fillText(txt, m.x + 20, m.y - 8);
      }
      putHeight(B2, first_leg_round_level + " cm");
      putHeight(Bpr, mid_thigh_level + " cm");
      putHeight(Dpr, narrowest_above_knee_level + " cm");
      putHeight(Fpr, knee_level + " cm");
      putHeight(B, narrowest_below_knee_level + " cm");
      putHeight(D, calf_level + " cm");
      putHeight(F, narrowest_level + " cm");
      putHeight(H, back_mal_level + " cm");

      ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 2;
      ctx.beginPath(); [A2, Apr, Cpr, Epr, A].map(M).forEach((p, i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
      ctx.beginPath(); [B2, Bpr, Dpr, Fpr, B].map(M).forEach((p, i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
      ctx.beginPath(); [A, C, E, G].map(M).forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
      ctx.beginPath(); [B, D, F, H].map(M).forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();

      const WAIST_CURVE_X = 1.6 * scale;
      const WAIST_CURVE_Y = 1.0 * scale;

      if (!waistRightCtrl) waistRightCtrl = { x: (W2.x + H2.x)/2 + WAIST_CURVE_X, y: (W2.y + H2.y)/2 + WAIST_CURVE_Y };
      if (!waistLeftCtrl)  waistLeftCtrl  = { x: (W1.x + H1.x)/2 - WAIST_CURVE_X, y: (W1.y + H1.y)/2 + WAIST_CURVE_Y };

      let c2 = { x: (H2.x + B2.x)/2 + 0.79*scale, y: (H2.y + B2.y)/2 };

      const mW2 = M(W2), mH2 = M(H2), mB2 = M(B2), mC2 = M(c2);
      const mW1 = M(W1), mH1 = M(H1);
      const mWaistRightCtrl = M(waistRightCtrl);
      const mWaistLeftCtrl = M(waistLeftCtrl);

      ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mW2.x, mW2.y);
      ctx.quadraticCurveTo(mWaistRightCtrl.x, mWaistRightCtrl.y, mH2.x, mH2.y);
      ctx.quadraticCurveTo(mC2.x, mC2.y, mB2.x, mB2.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(mW1.x, mW1.y);
      ctx.quadraticCurveTo(mWaistLeftCtrl.x, mWaistLeftCtrl.y, mH1.x, mH1.y);
      ctx.stroke();

      drawGreenHandle(ctx, mWaistRightCtrl.x, mWaistRightCtrl.y, "b′");
      drawGreenHandle(ctx, mWaistLeftCtrl.x, mWaistLeftCtrl.y, "c′");
      handleDrawPos.waistRight = { x: mWaistRightCtrl.x, y: mWaistRightCtrl.y };
      handleDrawPos.waistLeft  = { x: mWaistLeftCtrl.x,  y: mWaistLeftCtrl.y };

      const maPrime = M(aPrime);
      ctx.beginPath(); ctx.arc(maPrime.x, maPrime.y, 3.8, 0, 2*Math.PI);
      ctx.fillStyle = "#000"; ctx.fill();
      ctx.font = "bold 14px Arial"; ctx.fillText("a′", maPrime.x + 8, maPrime.y + 16);

      const arc3 = circleFrom3Points(O2, aPrime, A2);

      if (arc3) {
        const Cc = arc3.c, Rr = arc3.r;
        const aStart = Math.atan2(O2.y - Cc.y, O2.x - Cc.x);
        const aMid = Math.atan2(aPrime.y - Cc.y, aPrime.x - Cc.x);
        const aEnd = Math.atan2(A2.y - Cc.y, A2.x - Cc.x);
        const useCCW = isAngleOnCCW(aStart, aEnd, aMid);

        function pointOnChosenArc(frac) {
          let s = aStart, e = aEnd;
          if (useCCW) {
            while (e < s) e += Math.PI * 2;
            let ang = s + (e - s) * frac;
            return { x: Cc.x + Rr*Math.cos(ang), y: Cc.y + Rr*Math.sin(ang) };
          } else {
            while (s < e) s += Math.PI * 2;
            let ang = s + (e - s) * frac;
            return { x: Cc.x + Rr*Math.cos(ang), y: Cc.y + Rr*Math.sin(ang) };
          }
        }

        if (!o2ArcCtrl1) o2ArcCtrl1 = pointOnChosenArc(0.33);
        if (!o2ArcCtrl2) o2ArcCtrl2 = pointOnChosenArc(0.66);

        if (!o2ArcCustom) {
          ctx.strokeStyle = "#000"; ctx.lineWidth = 2.2; ctx.beginPath();
          const steps = 120;
          let s = aStart, e = aEnd;
          if (useCCW) {
            while (e < s) e += Math.PI * 2;
            for (let i=0; i<=steps; i++) {
              const t = i/steps, ang = s + (e-s)*t;
              const p = { x: Cc.x + Rr*Math.cos(ang), y: Cc.y + Rr*Math.sin(ang) };
              const mp = M(p);
              if (i===0) ctx.moveTo(mp.x, mp.y); else ctx.lineTo(mp.x, mp.y);
            }
          } else {
            while (s < e) s += Math.PI * 2;
            for (let i=0; i<=steps; i++) {
              const t = i/steps, ang = s + (e-s)*t;
              const p = { x: Cc.x + Rr*Math.cos(ang), y: Cc.y + Rr*Math.sin(ang) };
              const mp = M(p);
              if (i===0) ctx.moveTo(mp.x, mp.y); else ctx.lineTo(mp.x, mp.y);
            }
          }
          ctx.stroke();
        } else {
          const mO2a = M(O2), mA2a = M(A2), mCtrl1 = M(o2ArcCtrl1), mCtrl2 = M(o2ArcCtrl2);
          ctx.strokeStyle = "#000"; ctx.lineWidth = 2.2; ctx.beginPath();
          ctx.moveTo(mO2a.x, mO2a.y);
          ctx.bezierCurveTo(mCtrl1.x, mCtrl1.y, mCtrl2.x, mCtrl2.y, mA2a.x, mA2a.y);
          ctx.stroke();
        }
      } else {
        if (!o2ArcCtrl1) o2ArcCtrl1 = { x: O2.x + (aPrime.x - O2.x) * 0.55, y: O2.y + (aPrime.y - O2.y) * 0.45 };
        if (!o2ArcCtrl2) o2ArcCtrl2 = { x: A2.x + (aPrime.x - A2.x) * 0.55, y: A2.y + (aPrime.y - A2.y) * 0.45 };
        const mO2a = M(O2), mA2a = M(A2), mCtrl1 = M(o2ArcCtrl1), mCtrl2 = M(o2ArcCtrl2);
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2.2; ctx.beginPath();
        ctx.moveTo(mO2a.x, mO2a.y);
        ctx.bezierCurveTo(mCtrl1.x, mCtrl1.y, mCtrl2.x, mCtrl2.y, mA2a.x, mA2a.y);
        ctx.stroke();
      }

      const mCtrl1 = M(o2ArcCtrl1), mCtrl2 = M(o2ArcCtrl2);
      drawGreenHandle(ctx, mCtrl1.x, mCtrl1.y, "");
      drawGreenHandle(ctx, mCtrl2.x, mCtrl2.y, "");
      handleDrawPos.o2Arc1 = { x: mCtrl1.x, y: mCtrl1.y };
      handleDrawPos.o2Arc2 = { x: mCtrl2.x, y: mCtrl2.y };

      let GH = Math.abs(H.x - G.x) / scale;
      let heelHalf = heel_len / 2;
      let GHhalf = GH / 2;
      let segLen = Math.round((heelHalf - GHhalf) * 10) / 10;
      if (segLen < 0) segLen = 0;

      let I = {x: G.x - segLen*scale, y: G.y};
      let J = {x: H.x + segLen*scale, y: H.y};

      ctx.strokeStyle = "#f90"; ctx.lineWidth = 2;
      let mI = M(I), mG = M(G), mH = M(H), mJ = M(J);
      ctx.beginPath(); ctx.moveTo(mG.x, mG.y); ctx.lineTo(mI.x, mI.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mH.x, mH.y); ctx.lineTo(mJ.x, mJ.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("I", mI.x - 18, mI.y + 6); ctx.fillText("J", mJ.x + 8, mJ.y + 6);
      ctx.font = "12px Arial"; ctx.fillStyle = "#f90";
      ctx.fillText("IG = HJ = "+segLen.toFixed(1)+" cm", mx(startX)-80, G.y-32);

      let IG = Math.abs(I.x - G.x) / scale;
      let y = Math.round(((front_mal_arc / malDiv) - IG)*10)/10;
      if (y < 0) y = 0;

      let ankle_result = Math.round(((ankle_front_arc / 2.3) - y)*10)/10;
      if (ankle_result < 0) ankle_result = 0;
      let K = {x: I.x, y: I.y + ankle_result*scale};
      let L = {x: startX, y: I.y + ankle_result*scale};
      let Mpt = {x: J.x, y: J.y + ankle_result*scale};

      let mK = M(K), mL = M(L), mMpt = M(Mpt);
      ctx.strokeStyle = "#CC33CC"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mI.x, mI.y); ctx.lineTo(mK.x, mK.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx(startX), I.y); ctx.lineTo(mx(startX), L.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mJ.x, mJ.y); ctx.lineTo(mMpt.x, mMpt.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mK.x, mK.y); ctx.lineTo(mL.x, mL.y); ctx.lineTo(mMpt.x, mMpt.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("K", mK.x - 18, mK.y + 6); ctx.fillText("L", mL.x - 12, mL.y + 18); ctx.fillText("M", mMpt.x + 8, mMpt.y + 6);

      let EF = Math.abs(F.x - E.x) / scale, halfEF = EF / 2;
      let N = {x: L.x - halfEF*scale, y: L.y};
      let O = {x: L.x + halfEF*scale, y: L.y};
      let mN = M(N), mO = M(O);
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("N", mN.x - 16, mN.y + 6); ctx.fillText("O", mO.x + 8, mO.y + 6);

      let hLP = (back_mal_level - narrowest_level - 1);
      let P = {x: L.x, y: L.y + hLP*scale};
      let mP = M(P);
      ctx.strokeStyle = "#0099ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mL.x, mL.y); ctx.lineTo(mP.x, mP.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222"; ctx.fillText("P", mP.x - 12, mP.y + 18);

      let Q = {x: P.x - y*scale, y: P.y};
      let R = {x: P.x + y*scale, y: P.y};
      let mQ = M(Q), mR = M(R);
      ctx.strokeStyle = "#b36b00"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mQ.x, mQ.y); ctx.lineTo(mR.x, mR.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("Q", mQ.x - 16, mQ.y + 6); ctx.fillText("R", mR.x + 8, mR.y + 6);
      ctx.font = "bold 13px Arial"; ctx.fillStyle = "#b36b00";
      ctx.fillText("y = " + y.toFixed(1) + " cm", mP.x + (footSide==="left" ? 16 : -95), mP.y - 10);

      let EG = Math.hypot(G.x - E.x, G.y - E.y) / scale;
      let intersNQ = getCircleIntersections(N, EG*scale, Q, IG*scale);
      let S = null;
      if (intersNQ.length === 2) {
        S = intersNQ[0].x < intersNQ[1].x ? intersNQ[0] : intersNQ[1];
        let mS = M(S);
        ctx.beginPath(); ctx.arc(mS.x, mS.y, 4, 0, 2*Math.PI); ctx.fillStyle = "#e60000"; ctx.fill();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222"; ctx.fillText("S", mS.x - 18, mS.y + 6);
        ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(mN.x, mN.y); ctx.lineTo(mS.x, mS.y); ctx.stroke();
      }

      let intersOR = getCircleIntersections(O, EG*scale, R, IG*scale);
      let T = null;
      if (intersOR.length === 2) {
        T = intersOR[0].x > intersOR[1].x ? intersOR[0] : intersOR[1];
        let mT = M(T);
        ctx.beginPath(); ctx.arc(mT.x, mT.y, 4, 0, 2*Math.PI); ctx.fillStyle = "#e60000"; ctx.fill();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222"; ctx.fillText("T", mT.x + 10, mT.y + 6);
        ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(mO.x, mO.y); ctx.lineTo(mT.x, mT.y); ctx.stroke();
      }

      let IK_height = Math.abs(K.y - I.y);
      function pointAlongLine(p0, p1, d) {
        let dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx, dy);
        if (len === 0) return { x: p0.x, y: p0.y };
        return { x: p0.x + (dx/len)*d, y: p0.y + (dy/len)*d };
      }

      let U = null, V = null;
      if (S) {
        U = pointAlongLine(Q, S, IK_height);
        let mU = M(U);
        ctx.strokeStyle = "#7c4dff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mQ.x, mQ.y); ctx.lineTo(mU.x, mU.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#7c4dff"; ctx.fillText("U", mU.x - 16, mU.y + 6);
      }
      if (T) {
        V = pointAlongLine(R, T, IK_height);
        let mV = M(V);
        ctx.strokeStyle = "#7c4dff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mR.x, mR.y); ctx.lineTo(mV.x, mV.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#7c4dff"; ctx.fillText("V", mV.x + 8, mV.y + 6);
      }

      let W = {x: P.x, y: P.y + ankle2meta*scale};
      let mW = M(W);
      ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mP.x, mP.y); ctx.lineTo(mW.x, mW.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#e67e22"; ctx.fillText("W", mW.x - 10, mW.y + 20);

      let meta_arc_len = Math.round((meta_head_arc / 1.15)*10)/10;
      let arc_half = meta_arc_len/2 * scale;
      let angle_rad = -10 * Math.PI / 180;
      let Y0 = {x: W.x - arc_half, y: W.y}, Z0 = {x: W.x + arc_half, y: W.y};
      let Y = rotatePoint(W.x, W.y, Y0.x, Y0.y, angle_rad);
      let Z = rotatePoint(W.x, W.y, Z0.x, Z0.y, angle_rad);
      let X = { x: Y.x + 3*scale, y: Y.y + meta2toe*scale };

      function mirror(pt) { return footSide === "right" ? {x: 2*startX - pt.x, y: pt.y} : pt; }
      let Ym = mirror(Y), Zm = mirror(Z), Xm = mirror(X);

      ctx.save();
      ctx.strokeStyle = "#2d85f0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Ym.x, Ym.y); ctx.lineTo(Zm.x, Zm.y); ctx.stroke();
      let yzLenCm = Math.hypot(Zm.x - Ym.x, Zm.y - Ym.y)/scale;
      let yzMid = { x: (Ym.x + Zm.x)/2, y: (Ym.y + Zm.y)/2 };
      ctx.font = "bold 14px Arial"; ctx.fillStyle = "#2d85f0";
      ctx.fillText("YZ = " + yzLenCm.toFixed(2) + " cm", yzMid.x - 40, yzMid.y - 12);
      ctx.restore();

      let bestLen = 0, bestP1 = null, bestP2 = null, minErr = 1e9;
      let targetLen = (meta_toe_circum + 2) * scale;
      for (let h = 0; h <= 8*scale; h += 2.0) {
        for (let s = 0.5*scale; s <= 3*scale; s += 2.0) {
          for (let h2 = h; h2 <= h+7; h2 += 3.0) {
            for (let s2 = 1.2*scale; s2 <= 4*scale; s2 += 2.0) {
              let localP1 = footSide === "left" ? { x: Xm.x - s, y: Xm.y + h } : { x: Xm.x + s, y: Xm.y + h };
              let localP2 = footSide === "left" ? { x: Xm.x + s2, y: Xm.y + h2 } : { x: Xm.x - s2, y: Xm.y + h2 };
              let len = cubicBezierLength(Ym, localP1, localP2, Zm, 80);
              let err = Math.abs(len - targetLen);
              if (err < minErr) { minErr = err; bestLen = len; bestP1 = localP1; bestP2 = localP2; }
            }
          }
        }
      }
      if (!bestP1 || !bestP2) { bestP1 = Xm; bestP2 = Xm; bestLen = Math.hypot(Zm.x-Ym.x, Zm.y-Ym.y); }

      function cubicClosestT(p0, p1, p2, p3, target, steps=100) {
        let minDist = 1e9, bestT = 0;
        for (let i=0; i<=steps; ++i) {
          let t = i/steps;
          let pt = cubicPointAtT(p0, p1, p2, p3, t);
          let d = Math.hypot(pt.x - target.x, pt.y - target.y);
          if (d < minDist) { minDist = d; bestT = t; }
        }
        return bestT;
      }
      function splitCubicAtT(p0, p1, p2, p3, t) {
        let q0 = { x: p0.x + (p1.x - p0.x)*t, y: p0.y + (p1.y - p0.y)*t };
        let q1 = { x: p1.x + (p2.x - p1.x)*t, y: p1.y + (p2.y - p1.y)*t };
        let q2 = { x: p2.x + (p3.x - p2.x)*t, y: p2.y + (p3.y - p2.y)*t };
        let r0 = { x: q0.x + (q1.x - q0.x)*t, y: q0.y + (q1.y - q0.y)*t };
        let r1 = { x: q1.x + (q2.x - q1.x)*t, y: q1.y + (q2.y - q1.y)*t };
        let s0 = { x: r0.x + (r1.x - r0.x)*t, y: r0.y + (r1.y - r0.y)*t };
        return [[p0, q0, r0, s0], [s0, r1, q2, p3]];
      }
      function computeCubicHandlesForMidpoint(p0, p3, mid) {
        let d = 0.45;
        let p1 = { x: p0.x + (mid.x - p0.x) * d, y: p0.y + (mid.y - p0.y) * d };
        let p2 = { x: p3.x + (mid.x - p3.x) * d, y: p3.y + (mid.y - p3.y) * d };
        return [p1, p2];
      }

      let tSplit = cubicClosestT(Ym, bestP1, bestP2, Zm, Xm, 150);
      let [arc1, arc2] = splitCubicAtT(Ym, bestP1, bestP2, Zm, tSplit);
      let arc1Length = cubicBezierLength(arc1[0], arc1[1], arc1[2], arc1[3], 120);
      let arc2Length = cubicBezierLength(arc2[0], arc2[1], arc2[2], arc2[3], 120);
      let tMid1 = findCubicTforArcLength(arc1[0], arc1[1], arc1[2], arc1[3], arc1Length/2, arc1Length, 180);
      let tMid2 = findCubicTforArcLength(arc2[0], arc2[1], arc2[2], arc2[3], arc2Length/2, arc2Length, 180);
      let b = cubicPointAtT(arc1[0], arc1[1], arc1[2], arc1[3], tMid1);
      let c = cubicPointAtT(arc2[0], arc2[1], arc2[2], arc2[3], tMid2);

      if (!arc1Control) arc1Control = { x: b.x, y: b.y };
      if (!arc2Control) arc2Control = { x: c.x, y: c.y };

      let arc1p1 = arc1[1], arc1p2 = arc1[2], arc2p1 = arc2[1], arc2p2 = arc2[2];
      if (arc1Handles) [arc1p1, arc1p2] = arc1Handles;
      if (arc2Handles) [arc2p1, arc2p2] = arc2Handles;
      if ((arc1Control && dragState.dragging === "yzArc1") || arc1Handles) {
        [arc1p1, arc1p2] = computeCubicHandlesForMidpoint(arc1[0], arc1[3], arc1Control);
        arc1Handles = [arc1p1, arc1p2];
      }
      if ((arc2Control && dragState.dragging === "yzArc2") || arc2Handles) {
        [arc2p1, arc2p2] = computeCubicHandlesForMidpoint(arc2[0], arc2[3], arc2Control);
        arc2Handles = [arc2p1, arc2p2];
      }

      ctx.save();
      ctx.strokeStyle = "#ff5522"; ctx.lineWidth = 3.2; ctx.beginPath();
      ctx.moveTo(arc1[0].x, arc1[0].y);
      ctx.bezierCurveTo(arc1p1.x, arc1p1.y, arc1p2.x, arc1p2.y, arc1[3].x, arc1[3].y);
      ctx.moveTo(arc2[0].x, arc2[0].y);
      ctx.bezierCurveTo(arc2p1.x, arc2p1.y, arc2p2.x, arc2p2.y, arc2[3].x, arc2[3].y);
      ctx.stroke();
      ctx.restore();

      drawGreenHandle(ctx, arc1Control.x, arc1Control.y, "");
      drawGreenHandle(ctx, arc2Control.x, arc2Control.y, "");
      handleDrawPos.yzArc1 = { x: arc1Control.x, y: arc1Control.y };
      handleDrawPos.yzArc2 = { x: arc2Control.x, y: arc2Control.y };

      ctx.font = "bold 13px Arial"; ctx.fillStyle = "#ff5522";
      ctx.fillText("Y–X–Z arc ≈ " + (bestLen/scale).toFixed(2) + " cm", Xm.x + 15, Xm.y + 40);

      ctx.save();
      ctx.beginPath(); ctx.arc(Ym.x, Ym.y, 6, 0, 2 * Math.PI); ctx.fillStyle = "#2d85f0"; ctx.fill();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#0033cc"; ctx.fillText("Y", Ym.x - 18, Ym.y - 5);
      ctx.beginPath(); ctx.arc(Xm.x, Xm.y, 6, 0, 2 * Math.PI); ctx.fillStyle = "#16a085"; ctx.fill();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#16a085"; ctx.fillText("X", Xm.x - 10, Xm.y - 10);
      ctx.beginPath(); ctx.arc(Zm.x, Zm.y, 6, 0, 2 * Math.PI); ctx.fillStyle = "#2d85f0"; ctx.fill();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#0033cc"; ctx.fillText("Z", Zm.x + 10, Zm.y - 5);
      ctx.restore();

      let bow = 7;
      let Um = U ? mirror(U) : null, Vm = V ? mirror(V) : null;
      if (Um && Ym) {
        let mid = { x: (Um.x+Ym.x)/2, y: (Um.y+Ym.y)/2 };
        let control = footSide === "left" ? { x: mid.x + bow, y: mid.y } : { x: mid.x - bow, y: mid.y };
        ctx.save(); ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.7;
        ctx.beginPath(); ctx.moveTo(Um.x, Um.y); ctx.quadraticCurveTo(control.x, control.y, Ym.x, Ym.y); ctx.stroke();
        ctx.restore();
      }
      if (Vm && Zm) {
        let midVZ = { x: (Vm.x+Zm.x)/2, y: (Vm.y+Zm.y)/2 };
        let controlVZ = footSide === "left" ? { x: midVZ.x - bow, y: midVZ.y } : { x: midVZ.x + bow, y: midVZ.y };
        ctx.save(); ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.7;
        ctx.beginPath(); ctx.moveTo(Vm.x, Vm.y); ctx.quadraticCurveTo(controlVZ.x, controlVZ.y, Zm.x, Zm.y); ctx.stroke();
        ctx.restore();
      }
    }

    function getMousePos(canvas, evt) {
      let rect = canvas.getBoundingClientRect();
      if (evt.touches && evt.touches.length > 0) {
        return {
          x: (evt.touches[0].clientX - rect.left) * (canvas.width / rect.width),
          y: (evt.touches[0].clientY - rect.top) * (canvas.height / rect.height)
        };
      }
      return {
        x: (evt.clientX - rect.left) * (canvas.width / rect.width),
        y: (evt.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function onCanvasDown(evt) {
      const canvas = document.getElementById('sockPattern');
      const pos = getMousePos(canvas, evt), hitR = 14;
      const candidates = [
        { mode: "waistRight", p: handleDrawPos.waistRight },
        { mode: "waistLeft",  p: handleDrawPos.waistLeft  },
        { mode: "o2Arc1",     p: handleDrawPos.o2Arc1     },
        { mode: "o2Arc2",     p: handleDrawPos.o2Arc2     },
        { mode: "yzArc1",     p: handleDrawPos.yzArc1     },
        { mode: "yzArc2",     p: handleDrawPos.yzArc2     }
      ];

      let best = null;
      for (const c of candidates) {
        if (!c.p) continue;
        const d = Math.hypot(pos.x - c.p.x, pos.y - c.p.y);
        if (d <= hitR && (!best || d < best.d)) best = { ...c, d };
      }
      if (best) {
        dragState.dragging = best.mode;
        dragState.offsetX = best.p.x - pos.x;
        dragState.offsetY = best.p.y - pos.y;
        evt.preventDefault();
      }
    }

    function onCanvasMove(evt) {
      if (!dragState.dragging) return;
      const canvas = document.getElementById('sockPattern');
      const pos = getMousePos(canvas, evt);
      const nx = pos.x + dragState.offsetX, ny = pos.y + dragState.offsetY;

      if (dragState.dragging === "yzArc1") {
        arc1Control.x = nx; arc1Control.y = ny; arc1Handles = null;
      } else if (dragState.dragging === "yzArc2") {
        arc2Control.x = nx; arc2Control.y = ny; arc2Handles = null;
      } else if (dragState.dragging === "waistRight") {
        waistRightCtrl.x = modelXFromDisplayX(nx, canvas); waistRightCtrl.y = ny;
      } else if (dragState.dragging === "waistLeft") {
        waistLeftCtrl.x = modelXFromDisplayX(nx, canvas); waistLeftCtrl.y = ny;
      } else if (dragState.dragging === "o2Arc1") {
        o2ArcCtrl1.x = modelXFromDisplayX(nx, canvas); o2ArcCtrl1.y = ny; o2ArcCustom = true;
      } else if (dragState.dragging === "o2Arc2") {
        o2ArcCtrl2.x = modelXFromDisplayX(nx, canvas); o2ArcCtrl2.y = ny; o2ArcCustom = true;
      }

      drawPattern();
      evt.preventDefault();
    }

    function onCanvasUp() { dragState.dragging = null; }
    function onCanvasLeave() { dragState.dragging = null; }
    function onCanvasTouchStart(evt) { onCanvasDown(evt); }
    function onCanvasTouchMove(evt) { onCanvasMove(evt); }
    function onCanvasTouchEnd() { onCanvasUp(); }

    let debounceTimer = null;
    function debounceDrawPattern() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        resetBezierDrags();
        drawPattern();
      }, 300);
    }

    window.onload = function() {
      drawPattern();
      const canvas = document.getElementById('sockPattern');
      canvas.addEventListener('mousedown', onCanvasDown);
      canvas.addEventListener('mousemove', onCanvasMove);
      canvas.addEventListener('mouseup', onCanvasUp);
      canvas.addEventListener('mouseleave', onCanvasLeave);
      canvas.addEventListener('touchstart', onCanvasTouchStart, { passive: false });
      canvas.addEventListener('touchmove', onCanvasTouchMove, { passive: false });
      canvas.addEventListener('touchend', onCanvasTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', onCanvasTouchEnd, { passive: false });

      document.getElementById('waist_hip_divisor').addEventListener('input', debounceDrawPattern);
      document.getElementById('legs_divisor').addEventListener('input', debounceDrawPattern);
    };

    document.getElementById('sockForm').addEventListener('input', debounceDrawPattern);

    function printPatternOnly() {
      const origCanvas = document.getElementById("sockPattern");
      const width = origCanvas.width, height = origCanvas.height;
      const printCanvas = document.createElement("canvas");
      printCanvas.width = width; printCanvas.height = height;
      drawPattern(printCanvas.getContext("2d"), true);
      const cropped = cropCanvasToPattern(printCanvas);

      const mainCanvas = document.getElementById("sockPattern");
      const origW = mainCanvas.width, origH = mainCanvas.height;
      mainCanvas.width = cropped.width; mainCanvas.height = cropped.height;
      mainCanvas.getContext("2d").drawImage(cropped, 0, 0);

      window.print();

      setTimeout(() => {
        mainCanvas.width = origW; mainCanvas.height = origH;
        drawPattern();
      }, 100);
    }

    function getPatternBoundingBoxForPDF(canvas, bgColor=[255, 251, 231], tol=6) {
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      const data = ctx.getImageData(0, 0, width, height).data;

      let minX = width, minY = height, maxX = -1, maxY = -1;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];

          const isTransparent = a === 0;
          const isBgColor =
            Math.abs(r - bgColor[0]) <= tol &&
            Math.abs(g - bgColor[1]) <= tol &&
            Math.abs(b - bgColor[2]) <= tol &&
            a > 0;

          if (!isTransparent && !isBgColor) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX < minX || maxY < minY) return null;

      minX = Math.max(0, minX - 20);
      minY = Math.max(0, minY - 20);
      maxX = Math.min(width - 1, maxX + 20);
      maxY = Math.min(height - 1, maxY + 20);

      return { minX, minY, maxX, maxY, width: maxX - minX + 1, height: maxY - minY + 1 };
    }

    function centerPatternBeforePDF(srcCanvas) {
      const bbox = getPatternBoundingBoxForPDF(srcCanvas);
      if (!bbox) return srcCanvas;

      const centered = document.createElement("canvas");
      centered.width = srcCanvas.width;
      centered.height = srcCanvas.height;
      const cctx = centered.getContext("2d");

      cctx.fillStyle = "#fffbe7";
      cctx.fillRect(0, 0, centered.width, centered.height);

      const dx = Math.round((centered.width - bbox.width) / 2 - bbox.minX);
      const dy = Math.round((centered.height - bbox.height) / 2 - bbox.minY);
      cctx.drawImage(srcCanvas, dx, dy);

      return centered;
    }

    function cropCanvasToPatternForPDF(srcCanvas) {
      const bbox = getPatternBoundingBoxForPDF(srcCanvas);
      if (!bbox) return srcCanvas;

      const cropped = document.createElement("canvas");
      cropped.width = bbox.width;
      cropped.height = bbox.height;
      const ctx = cropped.getContext("2d");

      ctx.fillStyle = "#fffbe7";
      ctx.fillRect(0, 0, cropped.width, cropped.height);
      ctx.drawImage(
        srcCanvas,
        bbox.minX, bbox.minY, bbox.width, bbox.height,
        0, 0, bbox.width, bbox.height
      );

      return cropped;
    }

    // forceOrientation: null | "portrait" | "landscape"
    function exportPatternPDF(paperFormat, fileName, forceOrientation = null) {
      const { jsPDF } = window.jspdf;

      const previewCanvas = document.getElementById("sockPattern");
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = previewCanvas.width;
      exportCanvas.height = previewCanvas.height;

      drawPattern(exportCanvas.getContext("2d"), true);

      const centeredCanvas = centerPatternBeforePDF(exportCanvas);
      const cropped = cropCanvasToPatternForPDF(centeredCanvas);

      const pxPerCm = 10;
      const pxPerMM = pxPerCm / 10;

      const patternWmm = cropped.width / pxPerMM;
      const patternHmm = cropped.height / pxPerMM;

      const autoOrientation = patternWmm > patternHmm ? "landscape" : "portrait";
      const orientation = forceOrientation || autoOrientation;

      const pdf = new jsPDF({ orientation, unit: "mm", format: paperFormat });

      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      const marginLeft = 12, marginRight = 12, marginTop = 12, marginBottom = 12;
      const printableWmm = pageWidth - marginLeft - marginRight;
      const printableHmm = pageHeight - marginTop - marginBottom;

      const tileWpx = Math.max(1, Math.floor(printableWmm * pxPerMM));
      const tileHpx = Math.max(1, Math.floor(printableHmm * pxPerMM));

      const cols = Math.ceil(cropped.width / tileWpx);
      const rows = Math.ceil(cropped.height / tileHpx);

      let pageNo = 0;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const sx = col * tileWpx;
          const sy = row * tileHpx;
          const sw = Math.min(tileWpx, cropped.width - sx);
          const sh = Math.min(tileHpx, cropped.height - sy);

          const tileCanvas = document.createElement("canvas");
          tileCanvas.width = sw;
          tileCanvas.height = sh;
          const tctx = tileCanvas.getContext("2d");

          tctx.fillStyle = "#fffbe7";
          tctx.fillRect(0, 0, sw, sh);
          tctx.drawImage(cropped, sx, sy, sw, sh, 0, 0, sw, sh);

          const drawWmm = sw / pxPerMM;
          const drawHmm = sh / pxPerMM;

          if (pageNo > 0) pdf.addPage();

          pdf.addImage(
            tileCanvas.toDataURL("image/png", 1.0),
            "PNG",
            marginLeft,
            marginTop,
            drawWmm,
            drawHmm
          );

          pdf.setFontSize(10);
          pdf.text(
            `Page ${pageNo + 1} / ${rows * cols}`,
            pageWidth - 46,
            pageHeight - 8
          );

          pageNo++;
        }
      }

      pdf.save(fileName);
    }

    function downloadPDF() {
      // A3 keeps auto orientation
      exportPatternPDF("a3", "single-leg-pants-pattern-true-size-a3.pdf");
    }

    function downloadPDFA2() {
      // A2 is always horizontal (landscape)
      exportPatternPDF("a2", "single-leg-pants-pattern-true-size-a2-horizontal.pdf", "landscape");
    }
  </script>
</body>

    };

      document.getElementById('btnRight').classList.toggle('active', side === 'right');
