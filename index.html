    function round1(v) { return Math.round(v * 10) / 10; }

    function getCircleIntersections(c1, r1, c2, r2) {
      let dx = c2.x - c1.x, dy = c2.y - c1.y;
      let d = Math.hypot(dx, dy);
      if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return [];
      let a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
      let h2 = r1 * r1 - a * a;
      if (h2 < 0) return [];
      let h = Math.sqrt(h2);
      let xm = c1.x + a * dx / d, ym = c1.y + a * dy / d;
      let rx = -dy * (h / d), ry = dx * (h / d);
      return [{ x: xm + rx, y: ym + ry }, { x: xm - rx, y: ym - ry }];
    }

    function rotatePoint(cx, cy, px, py, angleRad) {
      let dx = px - cx, dy = py - cy;
      let cos = Math.cos(angleRad), sin = Math.sin(angleRad);
      return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
    }

    function cubicBezierLength(p0, p1, p2, p3, steps = 80) {
      let len = 0, prev = p0;
      for (let i = 1; i <= steps; ++i) {
        let t = i / steps;
        let x = (1 - t) ** 3 * p0.x + 3 * (1 - t) ** 2 * t * p1.x + 3 * (1 - t) * t * t * p2.x + t ** 3 * p3.x;
        let y = (1 - t) ** 3 * p0.y + 3 * (1 - t) ** 2 * t * p1.y + 3 * (1 - t) * t * t * p2.y + t ** 3 * p3.y;
        let pt = { x, y };
        len += Math.hypot(pt.x - prev.x, pt.y - prev.y);
        prev = pt;
      }
      return len;
    }

    function cubicPointAtT(p0, p1, p2, p3, t) {
      let mt = 1 - t, mt2 = mt * mt, t2 = t * t;
      return {
        x: mt2 * mt * p0.x + 3 * mt2 * t * p1.x + 3 * mt * t2 * p2.x + t2 * t * p3.x,
        y: mt2 * mt * p0.y + 3 * mt2 * t * p1.y + 3 * mt * t2 * p2.y + t2 * t * p3.y
      };
    }

    function findCubicTforArcLength(p0, p1, p2, p3, targetLen, steps = 200) {
      let len = 0, prev = p0;
      for (let i = 1; i <= steps; ++i) {
        let t = i / steps;
        let pt = cubicPointAtT(p0, p1, p2, p3, t);
        len += Math.hypot(pt.x - prev.x, pt.y - prev.y);
        if (len >= targetLen) return t;
        prev = pt;
      }
      return 1;
    }

    function drawGentleCurve(ctx, p0, p1, degree = 15, color = "#555", width = 2.4, dash = [], faceRight = true) {
      let dx = p1.x - p0.x, dy = p1.y - p0.y;
      let len = Math.hypot(dx, dy);
      if (len < 1) return;
      let mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
      let n1 = { x: -dy / len, y: dx / len };
      let n2 = { x: dy / len, y: -dx / len };
      let n = faceRight ? ((n1.x >= n2.x) ? n1 : n2) : ((n1.x < n2.x) ? n1 : n2);
      let offset = Math.tan(degree * Math.PI / 180) * (len * 0.25);
      let cp = { x: mid.x + n.x * offset, y: mid.y + n.y * offset };
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(cp.x, cp.y, p1.x, p1.y);
      ctx.stroke();
      ctx.restore();
    }

    function getPatternBoundingBox(canvas, bgColor = [255, 251, 231, 255], padding = 20, tolerance = 3) {
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      const imageData = ctx.getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = 0, maxY = 0, found = false;
      for (let y = 0; y < height; ++y) {
        for (let x = 0; x < width; ++x) {
          let i = (y * width + x) * 4;
          let r = imageData[i], g = imageData[i + 1], b = imageData[i + 2], a = imageData[i + 3];
          let isBg = Math.abs(r - bgColor[0]) <= tolerance &&
                     Math.abs(g - bgColor[1]) <= tolerance &&
                     Math.abs(b - bgColor[2]) <= tolerance &&
                     a === 255;
          if (!isBg) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) return null;
      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(width - 1, maxX + padding);
      maxY = Math.min(height - 1, maxY + padding);
      return { minX, minY, maxX, maxY };
    }

    function cropCanvasCenteredOnMidline(srcCanvas, midX, padX = 45, padY = 35, tol = 3) {
      const bbox = getPatternBoundingBox(srcCanvas, [255, 251, 231, 255], 0, tol);
      if (!bbox) return srcCanvas;

      const yTop = Math.max(0, bbox.minY - padY);
      const yBottom = Math.min(srcCanvas.height - 1, bbox.maxY + padY);

      const leftDist = Math.max(0, midX - bbox.minX);
      const rightDist = Math.max(0, bbox.maxX - midX);
      const half = Math.ceil(Math.max(leftDist, rightDist) + padX);

      const outW = Math.max(1, half * 2 + 1);
      const outH = Math.max(1, yBottom - yTop + 1);

      const out = document.createElement("canvas");
      out.width = outW;
      out.height = outH;
      const octx = out.getContext("2d");
      octx.fillStyle = "#fffbe7";
      octx.fillRect(0, 0, outW, outH);

      const dx = half - midX;
      const dy = -yTop;
      octx.drawImage(srcCanvas, dx, dy);

      return out;
    }

    let dragState = { dragging: null, offsetX: 0, offsetY: 0 };
    let arc1Control = null, arc2Control = null;
    let arc1Handles = null, arc2Handles = null;

    function resetBezierDrags() { arc1Control = null; arc2Control = null; arc1Handles = null; arc2Handles = null; }
    function resetToOriginalPattern() { applyOriginalDefaults(); resetBezierDrags(); drawPattern(); }

    function drawPattern(ctxOverride, hideRuler = false) {
      let canvas, ctx;
      if (ctxOverride) { ctx = ctxOverride; canvas = ctx.canvas; }
      else {
        canvas = document.getElementById('sockPattern');
        ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      let leglen_waist = parseFloat(document.getElementById('leglen_waist').value);
      let waist_level = parseFloat(document.getElementById('waist_level').value);
      let waist_circ = parseFloat(document.getElementById('waist_circ').value);
      let hip_level = parseFloat(document.getElementById('hip_level').value);
      let hip_circ = parseFloat(document.getElementById('hip_circ').value);

      let first_leg_round_level = parseFloat(document.getElementById('first_leg_round_level').value);
      let first_leg_round_circ = parseFloat(document.getElementById('first_leg_round_circ').value);
      let mid_thigh_level = parseFloat(document.getElementById('mid_thigh_level').value);
      let mid_thigh_circ = parseFloat(document.getElementById('mid_thigh_circ').value);
      let narrowest_above_knee_level = parseFloat(document.getElementById('narrowest_above_knee_level').value);
      let narrowest_above_knee_circ = parseFloat(document.getElementById('narrowest_above_knee_circ').value);
      let knee_level = parseFloat(document.getElementById('knee_level').value);
      let knee_circ = parseFloat(document.getElementById('knee_circ').value);
      let narrowest_below_knee_level = parseFloat(document.getElementById('narrowest_below_knee_level').value);
      let bk_circ = parseFloat(document.getElementById('bk_circ').value);
      let calf_level = parseFloat(document.getElementById('calf_level').value);
      let calf_circ = parseFloat(document.getElementById('calf_circ').value);
      let narrowest_level = parseFloat(document.getElementById('narrowest_level').value);
      let narrowest_circ = parseFloat(document.getElementById('narrowest_circ').value);
      let back_mal_level = parseFloat(document.getElementById('back_mal_level').value);
      let back_mal_arc = parseFloat(document.getElementById('back_mal_arc').value);

      let front_mal_arc = parseFloat(document.getElementById('front_mal_arc').value);
      let heel_len = parseFloat(document.getElementById('heel_len').value);
      let ankle_front_arc = parseFloat(document.getElementById('ankle_front_arc').value);
      let ankle2meta = parseFloat(document.getElementById('ankle2meta').value);
      let meta2toe = parseFloat(document.getElementById('meta2toe').value);
      let meta_head_arc = parseFloat(document.getElementById('meta_head_arc').value);
      let meta_toe_circum = parseFloat(document.getElementById('meta_toe_circum').value);

      let wPrimeOffset = parseFloat(document.getElementById('w_prime_offset').value);
      let wDoubleOffset = parseFloat(document.getElementById('w_double_offset').value);
      let w3ToWp = parseFloat(document.getElementById('w3_to_wp').value);
      let a2ToL1 = parseFloat(document.getElementById('a2_to_l1').value);
      let l1ToL2 = parseFloat(document.getElementById('l1_to_l2').value);

      let pressureDivWaistHip = parseFloat(document.getElementById('pressure_div_waist_hip').value);
      let pressureDivLegs = parseFloat(document.getElementById('pressure_div_legs').value);

      if (!isFinite(pressureDivWaistHip) || pressureDivWaistHip <= 0) pressureDivWaistHip = 4;
      if (!isFinite(pressureDivLegs) || pressureDivLegs <= 0) pressureDivLegs = 4.6;

      const isLegDivDefault = Math.abs(pressureDivLegs - 4.6) < 1e-9;
      const malleolusDivisor = isLegDivDefault ? 2.3 : (pressureDivLegs / 2);

      const scale = 10;
      const startX = canvas.width / 2;
      const startY = 100;
      const dir = footSide === "right" ? -1 : 1;
      lastMidX = startX;

      let halfLen_waistQ = round1(waist_circ / pressureDivWaistHip);
      let halfLen_hipQ = round1(hip_circ / pressureDivWaistHip);

      let halfLen_first = round1(first_leg_round_circ / pressureDivLegs);
      let halfLen_mid_thigh = round1(mid_thigh_circ / pressureDivLegs);
      let halfLen_above_knee = round1(narrowest_above_knee_circ / pressureDivLegs);
      let halfLen_knee = round1(knee_circ / pressureDivLegs);
      let halfLen_bk = round1(bk_circ / pressureDivLegs);
      let halfLen_calf = round1(calf_circ / pressureDivLegs);
      let halfLen_narrow = round1(narrowest_circ / pressureDivLegs);
      let halfLen_backmal = round1(back_mal_arc / malleolusDivisor);

      ctx.fillStyle = "#fffbe7";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!hideRuler) {
        ctx.save();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(50, 40); ctx.lineTo(50 + 10 * scale, 40); ctx.stroke();
        for (let i = 0; i <= 10; ++i) {
          ctx.beginPath(); ctx.moveTo(50 + i * scale, 40); ctx.lineTo(50 + i * scale, 22); ctx.stroke();
          ctx.font = "bold 13px Arial"; ctx.fillStyle = "#000";
          ctx.fillText(i, 50 + i * scale - 3, 62);
        }
        for (let i = 1; i <= 19; i += 2) {
          ctx.beginPath(); ctx.moveTo(50 + i * scale / 2, 40); ctx.lineTo(50 + i * scale / 2, 30); ctx.stroke();
        }
        ctx.font = "14px Arial";
        ctx.fillText("Calibration ruler: This should be exactly 10 cm", 15, 14);
        ctx.restore();
      }

      let y_waist = startY + waist_level * scale;
      let y_hip = startY + hip_level * scale;
      let y_first_round = startY + first_leg_round_level * scale;
      let y_mid_thigh = startY + mid_thigh_level * scale;
      let y_above_knee = startY + narrowest_above_knee_level * scale;
      let y_knee = startY + knee_level * scale;
      let y0 = startY + narrowest_below_knee_level * scale;
      let y_calf = startY + calf_level * scale;
      let y_narrow = startY + narrowest_level * scale;
      let y_backmal = startY + back_mal_level * scale;
      let y_waist_to_mal_end = y_waist + leglen_waist * scale;

      let A2 = { x: startX - dir * halfLen_first * scale, y: y_first_round };
      let B2 = { x: startX + dir * halfLen_first * scale, y: y_first_round };
      let Apr = { x: startX - dir * halfLen_mid_thigh * scale, y: y_mid_thigh };
      let Bpr = { x: startX + dir * halfLen_mid_thigh * scale, y: y_mid_thigh };
      let Cpr = { x: startX - dir * halfLen_above_knee * scale, y: y_above_knee };
      let Dpr = { x: startX + dir * halfLen_above_knee * scale, y: y_above_knee };
      let Epr = { x: startX - dir * halfLen_knee * scale, y: y_knee };
      let Fpr = { x: startX + dir * halfLen_knee * scale, y: y_knee };

      let A = { x: startX - dir * halfLen_bk * scale, y: y0 };
      let B = { x: startX + dir * halfLen_bk * scale, y: y0 };
      let C = { x: startX - dir * halfLen_calf * scale, y: y_calf };
      let D = { x: startX + dir * halfLen_calf * scale, y: y_calf };
      let E = { x: startX - dir * halfLen_narrow * scale, y: y_narrow };
      let F = { x: startX + dir * halfLen_narrow * scale, y: y_narrow };
      let G = { x: startX - dir * halfLen_backmal * scale, y: y_backmal };
      let H = { x: startX + dir * halfLen_backmal * scale, y: y_backmal };

      ctx.save();
      ctx.strokeStyle = "#444";
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, y_waist);
      ctx.lineTo(startX, y_waist_to_mal_end);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(startX - 10, y_waist); ctx.lineTo(startX + 10, y_waist);
      ctx.moveTo(startX - 10, y_waist_to_mal_end); ctx.lineTo(startX + 10, y_waist_to_mal_end);
      ctx.stroke();
      ctx.font = "13px Arial"; ctx.fillStyle = "#003366";
      ctx.fillText("0 cm (waist)", startX + 14, y_waist + 4);
      ctx.fillText(leglen_waist.toFixed(1) + " cm", startX + 14, y_waist_to_mal_end + 4);
      ctx.restore();

      function outsideLabelX(pt, leftPad = -24, rightPad = 8) {
        return pt.x < startX ? pt.x + leftPad : pt.x + rightPad;
      }

      function drawLevelLine(p1, p2, labelL, labelR, cmVal, cmColor, yText) {
        ctx.strokeStyle = cmColor; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
        ctx.fillText(labelL, outsideLabelX(p1), p1.y + 6);
        ctx.fillText(labelR, outsideLabelX(p2), p2.y + 6);
        ctx.font = "12px Arial"; ctx.fillStyle = cmColor;
        ctx.fillText(cmVal, startX - 24, yText - 16);
      }

      function drawHeightMark(p1, p2, yValText, yCoord) {
        const xOut = Math.max(p1.x, p2.x) + 20;
        ctx.fillStyle = "#003366";
        ctx.fillText(yValText, xOut, yCoord - 8);
      }

      drawLevelLine(A2, B2, "A''", "B''", (halfLen_first * 2).toFixed(1) + " cm", "#d64545", y_first_round);
      drawHeightMark(A2, B2, first_leg_round_level + " cm", y_first_round);
      drawLevelLine(Apr, Bpr, "A'", "B'", (halfLen_mid_thigh * 2).toFixed(1) + " cm", "#0b7fab", y_mid_thigh);
      drawHeightMark(Apr, Bpr, mid_thigh_level + " cm", y_mid_thigh);
      drawLevelLine(Cpr, Dpr, "C'", "D'", (halfLen_above_knee * 2).toFixed(1) + " cm", "#7b3fc8", y_above_knee);
      drawHeightMark(Cpr, Dpr, narrowest_above_knee_level + " cm", y_above_knee);
      drawLevelLine(Epr, Fpr, "E'", "F'", (halfLen_knee * 2).toFixed(1) + " cm", "#a14a22", y_knee);
      drawHeightMark(Epr, Fpr, knee_level + " cm", y_knee);
      drawLevelLine(A, B, "A", "B", (halfLen_bk * 2).toFixed(1) + " cm", "#2277cc", y0);
      drawHeightMark(A, B, narrowest_below_knee_level + " cm", y0);
      drawLevelLine(C, D, "C", "D", (halfLen_calf * 2).toFixed(1) + " cm", "#7c3bff", y_calf);
      drawHeightMark(C, D, calf_level + " cm", y_calf);
      drawLevelLine(E, F, "E", "F", (halfLen_narrow * 2).toFixed(1) + " cm", "#19b37b", y_narrow);
      drawHeightMark(E, F, narrowest_level + " cm", y_narrow);
      drawLevelLine(G, H, "G", "H", (halfLen_backmal * 2).toFixed(1) + " cm", "#ff7c7c", y_backmal);
      drawHeightMark(G, H, back_mal_level + " cm", y_backmal);

      const L1x = B2.x;
      const Wp = { x: L1x, y: y_waist };
      const Hp = { x: L1x, y: y_hip };

      ctx.save();
      ctx.strokeStyle = "#1f5f9c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Wp.x, Wp.y); ctx.lineTo(B2.x, B2.y); ctx.stroke();
      ctx.font = "bold 13px Arial"; ctx.fillStyle = "#1f5f9c";
      ctx.fillText("L1", outsideLabelX(B2, -24, 10), y_first_round - 8);
      ctx.restore();

      const Wpp = { x: Wp.x - dir * halfLen_waistQ * scale, y: Wp.y };
      ctx.strokeStyle = "#1f9d55"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(Wp.x, Wp.y); ctx.lineTo(Wpp.x, Wpp.y); ctx.stroke();

      const wPrime = { x: Wpp.x + dir * wPrimeOffset * scale, y: Wpp.y };
      const wDoublePrime = { x: Wpp.x - dir * wDoubleOffset * scale, y: Wpp.y };

      ctx.strokeStyle = "#2ca02c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Wpp.x, Wpp.y); ctx.lineTo(wDoublePrime.x, wDoublePrime.y); ctx.stroke();

      let Wtriple = null;
      let intsW = getCircleIntersections(Wp, halfLen_waistQ * scale, wPrime, w3ToWp * scale);
      if (intsW.length) Wtriple = intsW.sort((a, b) => (a.y - b.y) || (dir * (a.x - b.x)))[0];
      if (!Wtriple) {
        const fallbackAngle = 145 * Math.PI / 180;
        Wtriple = {
          x: Wp.x + dir * Math.cos(fallbackAngle) * (halfLen_waistQ * scale),
          y: Wp.y + Math.sin(fallbackAngle) * (halfLen_waistQ * scale)
        };
      }

      ctx.save();
      ctx.strokeStyle = "#d62828"; ctx.lineWidth = 2.4; ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.moveTo(Wp.x, Wp.y); ctx.lineTo(Wtriple.x, Wtriple.y); ctx.stroke();
      ctx.restore();

      const Hpp = { x: Hp.x - dir * halfLen_hipQ * scale, y: Hp.y };
      ctx.strokeStyle = "#2b8a3e"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Hp.x, Hp.y); ctx.lineTo(Hpp.x, Hpp.y); ctx.stroke();

      const lPrime = { x: A2.x - dir * a2ToL1 * scale, y: A2.y };
      const lDoublePrime = { x: lPrime.x - dir * l1ToL2 * scale, y: A2.y };

      ctx.strokeStyle = "#2ca02c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(A2.x, A2.y); ctx.lineTo(lPrime.x, lPrime.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lPrime.x, lPrime.y); ctx.lineTo(lDoublePrime.x, lDoublePrime.y); ctx.stroke();

      ctx.strokeStyle = "#111"; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(Wp.x, Wp.y); ctx.lineTo(Hp.x, Hp.y); ctx.lineTo(B2.x, B2.y); ctx.stroke();

      ctx.save();
      ctx.strokeStyle = "#d62828"; ctx.lineWidth = 2.4; ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.moveTo(Wtriple.x, Wtriple.y); ctx.lineTo(wPrime.x, wPrime.y); ctx.stroke();
      ctx.restore();

      drawGentleCurve(ctx, wPrime, Hpp, 15, "#d62828", 2.4, [7, 5], dir === 1);
      drawGentleCurve(ctx, Hpp, lDoublePrime, 15, "#d62828", 2.4, [7, 5], dir === 1);
      drawGentleCurve(ctx, lDoublePrime, Apr, 15, "#d62828", 2.4, [7, 5], dir === 1);

      ctx.strokeStyle = "#1f9d55"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(wDoublePrime.x, wDoublePrime.y); ctx.lineTo(Hpp.x, Hpp.y); ctx.stroke();
      drawGentleCurve(ctx, Hpp, lPrime, 15, "#1f9d55", 2.4, [], dir === 1);
      drawGentleCurve(ctx, lPrime, Apr, 15, "#1f9d55", 2.4, [], dir === 1);

      ctx.font = "bold 14px Arial";
      ctx.fillStyle = "#111";
      ctx.fillText("W'", outsideLabelX(Wp, -24, 8), Wp.y - 6);
      ctx.fillText("W''", outsideLabelX(Wpp, -24, 8), Wpp.y - 6);
      ctx.fillStyle = "#d62828";
      ctx.fillText("W'''", outsideLabelX(Wtriple, -26, 8), Wtriple.y - 6);
      ctx.fillText("w'", outsideLabelX(wPrime, -10, 8), wPrime.y - 10);
      ctx.fillText("H''", outsideLabelX(Hpp, -24, 8), Hpp.y - 6);
      ctx.fillText("l''", outsideLabelX(lDoublePrime, -16, 8), lDoublePrime.y - 10);
      ctx.fillText("A'", outsideLabelX(Apr, -18, 8), Apr.y - 12);
      ctx.fillStyle = "#1f9d55";
      ctx.fillText("w''", outsideLabelX(wDoublePrime, -20, 8), wDoublePrime.y - 10);
      ctx.fillText("l'", outsideLabelX(lPrime, -12, 8), lPrime.y - 10);
      ctx.fillText("I'", outsideLabelX(lPrime, -10, 8), lPrime.y + 16);
      ctx.fillText("I''", outsideLabelX(lDoublePrime, -14, 8), lDoublePrime.y + 16);
      ctx.fillStyle = "#111";
      ctx.fillText("H'", outsideLabelX(Hp, -20, 8), Hp.y - 6);

      ctx.font = "12px Arial";
      ctx.fillStyle = "#6c2eb9";
      ctx.fillText("Waist/" + pressureDivWaistHip.toFixed(1) + " = " + halfLen_waistQ.toFixed(1) + " cm", Wpp.x + 10, Wpp.y - 16);
      ctx.fillStyle = "#2b8a3e";
      ctx.fillText("Hip/" + pressureDivWaistHip.toFixed(1) + " = " + halfLen_hipQ.toFixed(1) + " cm", Hpp.x + 10, Hpp.y - 16);
      ctx.fillStyle = "#7f4a00";
      ctx.fillText("Back ext = " + wPrimeOffset.toFixed(1) + " cm", wPrime.x + 6, wPrime.y + 16);
      ctx.fillText("Front ext = " + wDoubleOffset.toFixed(1) + " cm", wDoublePrime.x - 10, wDoublePrime.y + 16);

      ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Apr.x, Apr.y); ctx.lineTo(Cpr.x, Cpr.y); ctx.lineTo(Epr.x, Epr.y); ctx.lineTo(A.x, A.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(B2.x, B2.y); ctx.lineTo(Bpr.x, Bpr.y); ctx.lineTo(Dpr.x, Dpr.y); ctx.lineTo(Fpr.x, Fpr.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(C.x, C.y); ctx.lineTo(E.x, E.y); ctx.lineTo(G.x, G.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(D.x, D.y); ctx.lineTo(F.x, F.y); ctx.lineTo(H.x, H.y); ctx.stroke();

      let GH = Math.abs(H.x - G.x) / scale;
      let heelHalf = heel_len / 2;
      let GHhalf = GH / 2;
      let segLen = round1(heelHalf - GHhalf);
      if (segLen < 0) segLen = 0;
      let I = { x: G.x - dir * segLen * scale, y: G.y };
      let J = { x: H.x + dir * segLen * scale, y: H.y };

      ctx.strokeStyle = "#f90"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(G.x, G.y); ctx.lineTo(I.x, I.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(H.x, H.y); ctx.lineTo(J.x, J.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("I", outsideLabelX(I, -18, 8), I.y + 6);
      ctx.fillText("J", outsideLabelX(J, -18, 8), J.y + 6);
      ctx.font = "12px Arial"; ctx.fillStyle = "#f90";
      ctx.fillText("IG = HJ = " + segLen.toFixed(1) + " cm", startX - 80, G.y - 32);

      let IG = Math.abs(I.x - G.x) / scale;
      let y = round1((front_mal_arc / malleolusDivisor) - IG);
      if (y < 0) y = 0;
      ctx.font = "13px Arial"; ctx.fillStyle = "#CC33CC";
      const yLabelX = dir === 1 ? (J.x + 60) : (J.x - 120);
      ctx.fillText("y = " + y.toFixed(1) + " cm", yLabelX, J.y + 6);

      let ankle_result = round1((ankle_front_arc / 2.3) - y);
      if (ankle_result < 0) ankle_result = 0;
      let K = { x: I.x, y: I.y + ankle_result * scale };
      let L = { x: startX, y: I.y + ankle_result * scale };
      let M = { x: J.x, y: J.y + ankle_result * scale };
      ctx.strokeStyle = "#CC33CC"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(I.x, I.y); ctx.lineTo(K.x, K.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(startX, I.y); ctx.lineTo(L.x, L.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(J.x, J.y); ctx.lineTo(M.x, M.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(K.x, K.y); ctx.lineTo(L.x, L.y); ctx.lineTo(M.x, M.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("K", outsideLabelX(K, -18, 8), K.y + 6);
      ctx.fillText("L", outsideLabelX(L, -12, 8), L.y + 18);
      ctx.fillText("M", outsideLabelX(M, -18, 8), M.y + 6);
      ctx.font = "12px Arial"; ctx.fillStyle = "#CC33CC";
      ctx.fillText("KL = LM = " + ankle_result.toFixed(1) + " cm", L.x + 30, L.y - 8);
      ctx.fillText("LK height = " + ankle_result.toFixed(1) + " cm", L.x + 30, L.y + 12);

      let EF = Math.abs(F.x - E.x) / scale;
      let halfEF = EF / 2;
      let N = { x: L.x - dir * halfEF * scale, y: L.y };
      let O = { x: L.x + dir * halfEF * scale, y: L.y };
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("N", outsideLabelX(N, -16, 8), N.y + 6);
      ctx.fillText("O", outsideLabelX(O, -16, 8), O.y + 6);

      let hLP = (back_mal_level - narrowest_level - 1);
      let P = { x: L.x, y: L.y + hLP * scale };
      ctx.strokeStyle = "#0099ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(P.x, P.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("P", outsideLabelX(P, -12, 8), P.y + 18);

      let Q = { x: P.x - dir * y * scale, y: P.y };
      let R = { x: P.x + dir * y * scale, y: P.y };
      ctx.strokeStyle = "#b36b00"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Q.x, Q.y); ctx.lineTo(R.x, R.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#222";
      ctx.fillText("Q", outsideLabelX(Q, -16, 8), Q.y + 6);
      ctx.fillText("R", outsideLabelX(R, -16, 8), R.y + 6);

      let EG = Math.hypot(G.x - E.x, G.y - E.y) / scale;
      let intersNQ = getCircleIntersections(N, EG * scale, Q, IG * scale);
      let S = null;
      if (intersNQ.length === 2) {
        S = dir === 1 ? (intersNQ[0].x < intersNQ[1].x ? intersNQ[0] : intersNQ[1]) :
                        (intersNQ[0].x > intersNQ[1].x ? intersNQ[0] : intersNQ[1]);
        ctx.beginPath(); ctx.arc(S.x, S.y, 4, 0, 2 * Math.PI); ctx.fillStyle = "#e60000"; ctx.fill();
        ctx.font = "bold 15px Arial"; ctx.fillText("S", outsideLabelX(S, -18, 8), S.y + 6);
        ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(N.x, N.y); ctx.lineTo(S.x, S.y); ctx.stroke();
      }

      let intersOR = getCircleIntersections(O, EG * scale, R, IG * scale);
      let T = null;
      if (intersOR.length === 2) {
        T = dir === 1 ? (intersOR[0].x > intersOR[1].x ? intersOR[0] : intersOR[1]) :
                        (intersOR[0].x < intersOR[1].x ? intersOR[0] : intersOR[1]);
        ctx.beginPath(); ctx.arc(T.x, T.y, 4, 0, 2 * Math.PI); ctx.fillStyle = "#e60000"; ctx.fill();
        ctx.font = "bold 15px Arial"; ctx.fillText("T", outsideLabelX(T, -18, 10), T.y + 6);
        ctx.strokeStyle = "#e60000"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(O.x, O.y); ctx.lineTo(T.x, T.y); ctx.stroke();
      }

      function pointAlongLine(p0, p1, d) {
        let dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx, dy);
        return { x: p0.x + (dx / len) * d, y: p0.y + (dy / len) * d };
      }

      let IK_height = Math.abs(K.y - I.y);
      let U = null, V = null;
      if (S) {
        U = pointAlongLine(Q, S, IK_height);
        ctx.strokeStyle = "#7c4dff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(Q.x, Q.y); ctx.lineTo(U.x, U.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#7c4dff"; ctx.fillText("U", outsideLabelX(U, -16, 8), U.y + 6);
      }
      if (T) {
        V = pointAlongLine(R, T, IK_height);
        ctx.strokeStyle = "#7c4dff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(R.x, R.y); ctx.lineTo(V.x, V.y); ctx.stroke();
        ctx.font = "bold 15px Arial"; ctx.fillStyle = "#7c4dff"; ctx.fillText("V", outsideLabelX(V, -16, 8), V.y + 6);
      }

      let W = { x: P.x, y: P.y + ankle2meta * scale };
      ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(W.x, W.y); ctx.stroke();
      ctx.font = "bold 15px Arial"; ctx.fillStyle = "#e67e22"; ctx.fillText("W", outsideLabelX(W, -10, 8), W.y + 20);
      ctx.font = "12px Arial"; ctx.fillStyle = "#e67e22";
      const midPW = { x: (P.x + W.x) / 2, y: (P.y + W.y) / 2 };
      ctx.fillText(ankle2meta.toFixed(1) + " cm", midPW.x + 8, midPW.y - 4);

      let meta_arc_len = round1(meta_head_arc / 1.15);
      let arc_half = meta_arc_len / 2 * scale;
      let angle_rad = -10 * Math.PI / 180;
      let Y0 = { x: W.x - dir * arc_half, y: W.y };
      let Z0 = { x: W.x + dir * arc_half, y: W.y };
      let Y = rotatePoint(W.x, W.y, Y0.x, Y0.y, angle_rad);
      let Z = rotatePoint(W.x, W.y, Z0.x, Z0.y, angle_rad);

      let a = { x: Y.x + dir * 3 * scale, y: Y.y };
      let Xguide = { x: a.x, y: a.y + meta2toe * scale };

      ctx.strokeStyle = "#2d85f0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Y.x, Y.y); ctx.lineTo(Z.x, Z.y); ctx.stroke();
      ctx.font = "12px Arial"; ctx.fillStyle = "#2d85f0";
      ctx.fillText("YZ = " + meta_arc_len.toFixed(1) + " cm", (Y.x + Z.x) / 2 + 10, (Y.y + Z.y) / 2 - 8);

      let bestP1 = null, bestP2 = null, bestLen = 0, minErr = 1e9;
      let targetLen = (meta_toe_circum + 2) * scale;
      for (let h = 0; h <= 8 * scale; h += 2) {
        for (let s = 0.5 * scale; s <= 3 * scale; s += 2) {
          for (let h2 = h; h2 <= h + 7; h2 += 3) {
            for (let s2 = 1.2 * scale; s2 <= 4 * scale; s2 += 2) {
              let p1 = { x: Xguide.x - dir * s, y: Xguide.y + h };
              let p2 = { x: Xguide.x + dir * s2, y: Xguide.y + h2 };
              let len = cubicBezierLength(Y, p1, p2, Z, 80);
              let err = Math.abs(len - targetLen);
              if (err < minErr) { minErr = err; bestP1 = p1; bestP2 = p2; bestLen = len; }
            }
          }
        }
      }
      if (!bestP1 || !bestP2) { bestP1 = Xguide; bestP2 = Xguide; bestLen = Math.hypot(Z.x - Y.x, Z.y - Y.y); }

      function cubicClosestT(p0, p1, p2, p3, target, steps = 120) {
        let minDist = 1e9, bestT = 0;
        for (let i = 0; i <= steps; ++i) {
          let t = i / steps, pt = cubicPointAtT(p0, p1, p2, p3, t);
          let d = Math.hypot(pt.x - target.x, pt.y - target.y);
          if (d < minDist) { minDist = d; bestT = t; }
        }
        return bestT;
      }

      function splitCubicAtT(p0, p1, p2, p3, t) {
        let q0 = { x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t };
        let q1 = { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
        let q2 = { x: p2.x + (p3.x - p2.x) * t, y: p2.y + (p3.y - p2.y) * t };
        let r0 = { x: q0.x + (q1.x - q0.x) * t, y: q0.y + (q1.y - q0.y) * t };
        let r1 = { x: q1.x + (q2.x - q1.x) * t, y: q1.y + (q2.y - q1.y) * t };
        let s0 = { x: r0.x + (r1.x - r0.x) * t, y: r0.y + (r1.y - r0.y) * t };
        return [[p0, q0, r0, s0], [s0, r1, q2, p3]];
      }

      let tSplit = cubicClosestT(Y, bestP1, bestP2, Z, Xguide, 150);
      let [arc1, arc2] = splitCubicAtT(Y, bestP1, bestP2, Z, tSplit);
      let X = { x: arc1[3].x, y: arc1[3].y };

      let arc1Length = cubicBezierLength(arc1[0], arc1[1], arc1[2], arc1[3], 120);
      let arc2Length = cubicBezierLength(arc2[0], arc2[1], arc2[2], arc2[3], 120);
      let tMid1 = findCubicTforArcLength(arc1[0], arc1[1], arc1[2], arc1[3], arc1Length / 2, 180);
      let tMid2 = findCubicTforArcLength(arc2[0], arc2[1], arc2[2], arc2[3], arc2Length / 2, 180);
      let b = cubicPointAtT(arc1[0], arc1[1], arc1[2], arc1[3], tMid1);
      let c = cubicPointAtT(arc2[0], arc2[1], arc2[2], arc2[3], tMid2);

      if (!arc1Control) arc1Control = { x: b.x, y: b.y };
      if (!arc2Control) arc2Control = { x: c.x, y: c.y };

      function computeCubicHandlesForMidpoint(p0, p3, mid) {
        let d = 0.45;
        return [
          { x: p0.x + (mid.x - p0.x) * d, y: p0.y + (mid.y - p0.y) * d },
          { x: p3.x + (mid.x - p3.x) * d, y: p3.y + (mid.y - p3.y) * d }
        ];
      }

      let arc1p1 = arc1[1], arc1p2 = arc1[2], arc2p1 = arc2[1], arc2p2 = arc2[2];
      if (arc1Handles) [arc1p1, arc1p2] = arc1Handles;
      if (arc2Handles) [arc2p1, arc2p2] = arc2Handles;
      if ((arc1Control && dragState.dragging === "b") || arc1Handles) {
        [arc1p1, arc1p2] = computeCubicHandlesForMidpoint(arc1[0], arc1[3], arc1Control);
        arc1Handles = [arc1p1, arc1p2];
      }
      if ((arc2Control && dragState.dragging === "c") || arc2Handles) {
        [arc2p1, arc2p2] = computeCubicHandlesForMidpoint(arc2[0], arc2[3], arc2Control);
        arc2Handles = [arc2p1, arc2p2];
      }

      ctx.strokeStyle = "#ff5522"; ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(arc1[0].x, arc1[0].y); ctx.bezierCurveTo(arc1p1.x, arc1p1.y, arc1p2.x, arc1p2.y, arc1[3].x, arc1[3].y);
      ctx.moveTo(arc2[0].x, arc2[0].y); ctx.bezierCurveTo(arc2p1.x, arc2p1.y, arc2p2.x, arc2p2.y, arc2[3].x, arc2[3].y);
      ctx.stroke();

      ctx.beginPath(); ctx.arc(arc1Control.x, arc1Control.y, 7, 0, 2 * Math.PI); ctx.fillStyle = "#16a085"; ctx.fill();
      ctx.beginPath(); ctx.arc(arc2Control.x, arc2Control.y, 7, 0, 2 * Math.PI); ctx.fillStyle = "#16a085"; ctx.fill();

      ctx.font = "bold 13px Arial"; ctx.fillStyle = "#ff5522";
      ctx.fillText("X-Y-Z arc ≈ " + (bestLen / scale).toFixed(2) + " cm", X.x + 15, X.y + 40);

      ctx.beginPath(); ctx.arc(Y.x, Y.y, 6, 0, 2 * Math.PI); ctx.fillStyle = "#2d85f0"; ctx.fill();
      ctx.beginPath(); ctx.arc(X.x, X.y, 6, 0, 2 * Math.PI); ctx.fillStyle = "#16a085"; ctx.fill();
      ctx.beginPath(); ctx.arc(Z.x, Z.y, 6, 0, 2 * Math.PI); ctx.fillStyle = "#2d85f0"; ctx.fill();
      ctx.font = "bold 15px Arial";
      ctx.fillStyle = "#0033cc"; ctx.fillText("Y", outsideLabelX(Y, -18, 10), Y.y - 5);
      ctx.fillStyle = "#16a085"; ctx.fillText("X", outsideLabelX(X, -10, 10), X.y - 10);
      ctx.fillStyle = "#0033cc"; ctx.fillText("Z", outsideLabelX(Z, -18, 10), Z.y - 5);

      let bow = 7;
      if (U && Y) {
        let mid = { x: (U.x + Y.x) / 2, y: (U.y + Y.y) / 2 };
        let cp = { x: mid.x + dir * bow, y: mid.y };
        ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.7;
        ctx.beginPath(); ctx.moveTo(U.x, U.y); ctx.quadraticCurveTo(cp.x, cp.y, Y.x, Y.y); ctx.stroke();
      }
      if (V && Z) {
        let mid = { x: (V.x + Z.x) / 2, y: (V.y + Z.y) / 2 };
        let cp = { x: mid.x - dir * bow, y: mid.y };
        ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.7;
        ctx.beginPath(); ctx.moveTo(V.x, V.y); ctx.quadraticCurveTo(cp.x, cp.y, Z.x, Z.y); ctx.stroke();
      }

      if (!ctxOverride) updateExportInfo();
    }

    function getMousePos(canvas, evt) {
      let rect = canvas.getBoundingClientRect();
      if (evt.touches && evt.touches.length) {
        return {
          x: (evt.touches[0].clientX - rect.left) * (canvas.width / rect.width),
          y: (evt.touches[0].clientY - rect.top) * (canvas.height / rect.height)
        };
      }
      return {
        x: (evt.clientX - rect.left) * (canvas.width / rect.width),
        y: (evt.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function onCanvasDown(evt) {
      const canvas = document.getElementById('sockPattern');
      const pos = getMousePos(canvas, evt);
      let d1 = arc1Control ? Math.hypot(pos.x - arc1Control.x, pos.y - arc1Control.y) : 999;
      let d2 = arc2Control ? Math.hypot(pos.x - arc2Control.x, pos.y - arc2Control.y) : 999;
      if (d1 < 14) {
        dragState.dragging = "b";
        dragState.offsetX = arc1Control.x - pos.x;
        dragState.offsetY = arc1Control.y - pos.y;
        evt.preventDefault();
      } else if (d2 < 14) {
        dragState.dragging = "c";
        dragState.offsetX = arc2Control.x - pos.x;
        dragState.offsetY = arc2Control.y - pos.y;
        evt.preventDefault();
      }
    }

    function onCanvasMove(evt) {
      if (!dragState.dragging) return;
      const canvas = document.getElementById('sockPattern');
      const pos = getMousePos(canvas, evt);
      if (dragState.dragging === "b") {
        arc1Control.x = pos.x + dragState.offsetX;
        arc1Control.y = pos.y + dragState.offsetY;
        arc1Handles = null;
      } else if (dragState.dragging === "c") {
        arc2Control.x = pos.x + dragState.offsetX;
        arc2Control.y = pos.y + dragState.offsetY;
        arc2Handles = null;
      }
      drawPattern();
      evt.preventDefault();
    }

    function onCanvasUp() { dragState.dragging = null; }
    function onCanvasLeave() { dragState.dragging = null; }

    function buildPreviewCanvasCentered() {
      const main = document.getElementById("sockPattern");

      c.width = main.width;
      c.height = main.height;

    function buildPdfCanvasCentered() {
      const main = document.getElementById("sockPattern");
      const c = document.createElement("canvas");
      c.width = main.width;

    function makeExportCanvasRobust(srcCanvas) {
      const c = document.createElement("canvas");
      c.width = srcCanvas.width;
      c.height = srcCanvas.height;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fffbe7";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(srcCanvas, 0, 0);

      const offsets = [
        [0.2, 0], [-0.2, 0], [0, 0.2], [0, -0.2],
        [0.15, 0.15], [-0.15, -0.15], [0.15, -0.15], [-0.15, 0.15]
      ];
      ctx.globalAlpha = 0.22;
      offsets.forEach(([dx, dy]) => ctx.drawImage(srcCanvas, dx, dy));
      ctx.globalAlpha = 1;
      return c;
    }

    function tileAndExportPDFSafe(srcCanvas, fileName, format, orientation, marginMM = 2, bleedMM = 3) {
      const { jsPDF } = window.jspdf;
      const mmPerPx = 1;
      const totalW = srcCanvas.width * mmPerPx;
      const totalH = srcCanvas.height * mmPerPx;

      const pageSize = {
        a3: { portrait: [297, 420], landscape: [420, 297] },
        a2: { portrait: [420, 594], landscape: [594, 420] }
      };
      const [pageW, pageH] = pageSize[format][orientation];
      const usableW = pageW - marginMM * 2;
      const usableH = pageH - marginMM * 2;

      const cols = Math.max(1, Math.ceil(totalW / usableW));
      const rows = Math.max(1, Math.ceil(totalH / usableH));
      const pages = cols * rows;

      const pdf = new jsPDF({ orientation, unit: "mm", format });
      let idx = 0;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const xStart = c * usableW;
          const yStart = r * usableH;
          const wCore = Math.min(usableW, totalW - xStart);
          const hCore = Math.min(usableH, totalH - yStart);
          if (wCore <= 0 || hCore <= 0) continue;

          const sxCore = xStart / mmPerPx;
          const syCore = yStart / mmPerPx;
          const swCore = wCore / mmPerPx;
          const shCore = hCore / mmPerPx;

          const sx = Math.max(0, Math.floor(sxCore - bleedMM / mmPerPx));
          const sy = Math.max(0, Math.floor(syCore - bleedMM / mmPerPx));
          const ex = Math.min(srcCanvas.width, Math.ceil(sxCore + swCore + bleedMM / mmPerPx));
          const ey = Math.min(srcCanvas.height, Math.ceil(syCore + shCore + bleedMM / mmPerPx));
          const sw = Math.max(1, ex - sx);
          const sh = Math.max(1, ey - sy);

          const leftExtraMM = (sxCore - sx) * mmPerPx;
          const topExtraMM = (syCore - sy) * mmPerPx;
          const rightExtraMM = (ex - (sxCore + swCore)) * mmPerPx;
          const bottomExtraMM = (ey - (syCore + shCore)) * mmPerPx;

          const tile = document.createElement("canvas");
          tile.width = sw; tile.height = sh;
          const tctx = tile.getContext("2d");
          tctx.imageSmoothingEnabled = false;
          tctx.fillStyle = "#fffbe7";
          tctx.fillRect(0, 0, sw, sh);
          tctx.drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

          const data = tile.toDataURL("image/png", 1.0);

          if (idx > 0) pdf.addPage();

          const coreX = marginMM + (cols === 1 ? Math.max(0, (usableW - wCore) / 2) : 0);
          const coreY = marginMM;
          const drawX = Math.round((coreX - leftExtraMM) * 1000) / 1000;
          const drawY = Math.round((coreY - topExtraMM) * 1000) / 1000;
          const drawW = Math.round((wCore + leftExtraMM + rightExtraMM) * 1000) / 1000;
          const drawH = Math.round((hCore + topExtraMM + bottomExtraMM) * 1000) / 1000;

          pdf.addImage(data, "PNG", drawX, drawY, drawW, drawH);

          pdf.setFontSize(9);
          pdf.text(`Page idx+1/{pages} (rr+1c{c + 1})`, pageW - 62, pageH - 6);
          idx++;
        }
      }

      pdf.save(fileName);
      return { totalW, totalH, cols, rows, pages, format, orientation, marginMM };
    }

    function chooseBestA2Layout(totalW, totalH) {
      const candidates = [
        { orientation: "portrait", margin: 4 },
        { orientation: "portrait", margin: 2 },
        { orientation: "landscape", margin: 4 },
        { orientation: "landscape", margin: 2 },
        { orientation: "portrait", margin: 0 },
        { orientation: "landscape", margin: 0 }
      ];
      let best = null;
      for (const c of candidates) {
        const [pageW, pageH] = c.orientation === "portrait" ? [420, 594] : [594, 420];
        const usableW = pageW - c.margin * 2;
        const usableH = pageH - c.margin * 2;
        const cols = Math.max(1, Math.ceil(totalW / usableW));
        const rows = Math.max(1, Math.ceil(totalH / usableH));
        const pages = cols * rows;
        const score = pages * 1000 + cols * 30 + rows * 5 + (c.orientation === "portrait" ? 0 : 8);
        if (!best || score < best.score) best = { ...c, cols, rows, pages, score };
      }
      return best;
    }

    function downloadPDFA3Vertical() {
      const base = buildPdfCanvasCentered();
      const robust = makeExportCanvasRobust(base);
      const result = tileAndExportPDFSafe(

        "a3",
        "portrait",

      );
      let note = `A3 vertical: ${result.pages} page(s), grid ${result.cols} x ${result.rows}, pattern ${Math.round(result.totalW)} x ${Math.round(result.totalH)} mm.`;

    function downloadPDFA2TrueSize() {

      const result = tileAndExportPDFSafe(
        robust,

        best.orientation,

        3
      );
      document.getElementById("exportInfo").textContent =
        `A2 true size: ${result.pages} page(s), ${result.orientation}, margin ${result.marginMM} mm, grid ${result.cols} x ${result.rows}, pattern ${Math.round(result.totalW)} x ${Math.round(result.totalH)} mm.`;
    }

    function updateExportInfo() {
      const c = buildPdfCanvasCentered();
      const totalW = c.width, totalH = c.height;
      const a3UsableW = 297 - 4;
      const a3UsableH = 420 - 4;
      const a3Cols = Math.max(1, Math.ceil(totalW / a3UsableW));
      const a3Rows = Math.max(1, Math.ceil(totalH / a3UsableH));
      const a2best = chooseBestA2Layout(totalW, totalH);
      document.getElementById("exportInfo").textContent =
        `Estimated: A3 vertical a3Cols*a3Rowspage(s)({a3Cols} x ${a3Rows}), ` +
        `A2 a2best.pagespage(s)({a2best.orientation}, ${a2best.cols} x ${a2best.rows}).`;
    }

    let debounceTimer = null;
    function debounceDrawPattern() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        resetBezierDrags();
        drawPattern();
      }, 200);
    }

    function tileAndExportPDF_A3MidlineCentered(srcCanvas, fileName, marginMM = 2, bleedMM = 3, midXpx = null) {
      const { jsPDF } = window.jspdf;
      const mmPerPx = 1;
      const totalW = srcCanvas.width * mmPerPx;
      const totalH = srcCanvas.height * mmPerPx;

      const pageW = 297, pageH = 420;
      const usableW = pageW - marginMM * 2;
      const usableH = pageH - marginMM * 2;

      const midX = (midXpx == null ? srcCanvas.width / 2 : midXpx) * mmPerPx;

      const k = Math.floor(midX / usableW);
      const xOrigin = midX - (usableW / 2) - (k * usableW);

      const colStarts = [];
      let ci = 0;
      while (xOrigin + ci * usableW < totalW) {
        const x = xOrigin + ci * usableW;
        if (x + usableW > 0) colStarts.push(x);
        ci++;
        if (ci > 500) break;
      }

      const cols = colStarts.length;
      const rows = Math.max(1, Math.ceil(totalH / usableH));
      const pages = cols * rows;

      const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a3" });

      let idx = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const xStart = colStarts[c];
          const yStart = r * usableH;

          const x0 = Math.max(0, xStart);
          const x1 = Math.min(totalW, xStart + usableW);
          const y0 = Math.max(0, yStart);
          const y1 = Math.min(totalH, yStart + usableH);

          const wCore = x1 - x0;
          const hCore = y1 - y0;
          if (wCore <= 0 || hCore <= 0) continue;

          const sxCore = x0 / mmPerPx;
          const syCore = y0 / mmPerPx;
          const swCore = wCore / mmPerPx;
          const shCore = hCore / mmPerPx;

          const sx = Math.max(0, Math.floor(sxCore - bleedMM / mmPerPx));
          const sy = Math.max(0, Math.floor(syCore - bleedMM / mmPerPx));
          const ex = Math.min(srcCanvas.width, Math.ceil(sxCore + swCore + bleedMM / mmPerPx));
          const ey = Math.min(srcCanvas.height, Math.ceil(syCore + shCore + bleedMM / mmPerPx));
          const sw = Math.max(1, ex - sx);
          const sh = Math.max(1, ey - sy);

          const leftExtraMM = (sxCore - sx) * mmPerPx;
          const topExtraMM = (syCore - sy) * mmPerPx;
          const rightExtraMM = (ex - (sxCore + swCore)) * mmPerPx;
          const bottomExtraMM = (ey - (syCore + shCore)) * mmPerPx;

          const tile = document.createElement("canvas");
          tile.width = sw;
          tile.height = sh;
          const tctx = tile.getContext("2d");
          tctx.imageSmoothingEnabled = false;
          tctx.fillStyle = "#fffbe7";
          tctx.fillRect(0, 0, sw, sh);
          tctx.drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

          const data = tile.toDataURL("image/png", 1.0);
          if (idx > 0) pdf.addPage();

          const coreX = marginMM + (x0 - xStart);
          const coreY = marginMM;

          const drawX = Math.round((coreX - leftExtraMM) * 1000) / 1000;
          const drawY = Math.round((coreY - topExtraMM) * 1000) / 1000;
          const drawW = Math.round((wCore + leftExtraMM + rightExtraMM) * 1000) / 1000;
          const drawH = Math.round((hCore + topExtraMM + bottomExtraMM) * 1000) / 1000;

          pdf.addImage(data, "PNG", drawX, drawY, drawW, drawH);
          pdf.setFontSize(9);
          pdf.text(`Page idx+1/{pages} (rr+1c{c + 1})`, pageW - 62, pageH - 6);

          idx++;
        }
      }

      pdf.save(fileName);
      return { totalW, totalH, cols, rows, pages };
    }

    window.onload = function () {
      drawPattern();
      const canvas = document.getElementById('sockPattern');
      canvas.addEventListener('mousedown', onCanvasDown);
      canvas.addEventListener('mousemove', onCanvasMove);
      canvas.addEventListener('mouseup', onCanvasUp);
      canvas.addEventListener('mouseleave', onCanvasLeave);
      canvas.addEventListener('touchstart', onCanvasDown, { passive: false });
      canvas.addEventListener('touchmove', onCanvasMove, { passive: false });
      canvas.addEventListener('touchend', onCanvasUp, { passive: false });
      canvas.addEventListener('touchcancel', onCanvasUp, { passive: false });

      document.getElementById('sockForm').addEventListener('input', debounceDrawPattern);
      document.getElementById('pressure_div_waist_hip').addEventListener('input', debounceDrawPattern);
      document.getElementById('pressure_div_legs').addEventListener('input', debounceDrawPattern);
    };
  </script>
</body>

  <!-- ================= NAVIGATION SCRIPT ================= -->
  <script>
    const coverView = document.getElementById('coverView');
    const toolView  = document.getElementById('toolView');
    const toolFrame = document.getElementById('toolFrame');
    const toolTitle = document.getElementById('toolTitle');

    function openTool(n, title) {
      const src = document.getElementById('code' + n).value.trim();
      if (!src || /^PASTE CODE \d HERE$/.test(src)) {
        alert('Code ' + n + ' (' + title + ') has not been pasted into the file yet.');
        return;
      }
      toolTitle.textContent = title;
      toolFrame.srcdoc = src;           // loads the tool in its own isolated page
      coverView.style.display = 'none';
      toolView.style.display  = 'flex';
      window.scrollTo(0, 0);
    }

    function closeTool() {
      toolFrame.srcdoc = '<!DOCTYPE html><html><body></body></html>'; // unload tool and reset it
      toolView.style.display  = 'none';
      coverView.style.display = 'flex';
    }

    document.querySelectorAll('.hotspot').forEach(btn => {
      btn.addEventListener('click', () => openTool(btn.dataset.tool, btn.dataset.title));
    });
    document.getElementById('backBtn').addEventListener('click', closeTool);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && toolView.style.display === 'flex') closeTool();
    });
  </script>
</body>
</html>
